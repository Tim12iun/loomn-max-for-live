<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>prepn</title>
<style>
:root{--bg:#1e1e1e;--panel:#2a2a2a;--line:#3c3c3c;--text:#e6e6e6;--muted:#8d8d8d;--accent:#ff7a2f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:10.5px/1.25 -apple-system,"Helvetica Neue",sans-serif;padding:5px 6px;display:flex;flex-direction:column;gap:4px;user-select:none}
.row{display:flex;gap:4px;align-items:center}
input{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:2px 5px;flex:1;min-width:0}
button{font:inherit;font-weight:600;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:3px 6px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#777}
button:disabled{opacity:.4;cursor:default}
.ico{padding:2px 5px;color:var(--muted)}
.steps button{flex:1}
.steps .n{display:inline-block;width:13px;height:13px;line-height:13px;border-radius:50%;background:#444;color:#fff;font-size:9px;text-align:center;margin-right:4px}
.steps .go{background:var(--accent);border-color:var(--accent);color:#111}
.steps .go .n{background:#111;color:var(--accent)}
.meta{color:var(--muted);font-size:9.5px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.chip{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid transparent;border-radius:3px;padding:2px 4px;cursor:pointer;min-width:0;height:18px}
.chip:hover{border-color:#666}
.sw{flex:none;width:10px;height:10px;border-radius:2px}
.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.has .lbl{font-weight:600}.chip.has .cnt{color:var(--text)}
.chip.stem{box-shadow:inset 0 -2px 0 var(--accent)}
.chip.more{justify-content:center;color:var(--muted)}
.status{position:relative;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 3px;border-radius:2px;margin-top:auto}
.status i{position:absolute;inset:0;width:0;background:rgba(255,122,47,.25);z-index:-1}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
#pal.on{display:flex}
#pal .box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px}
#pal .t{color:var(--muted);margin-bottom:3px}
#pal .g{display:grid;grid-template-columns:repeat(14,15px);gap:2px}
#pal .g i{width:15px;height:15px;border-radius:2px;cursor:pointer;display:block}
#pal .g i:hover{outline:2px solid #fff}
#ov{position:fixed;inset:0;background:rgba(20,20,20,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
#ov.on{display:flex}
#ov .t{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.03em}
#ov .s{color:var(--text);font-size:11px}
#ov .b{width:90%;height:8px;background:#333;border-radius:4px;overflow:hidden}
#ov .b i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#ov .p{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#ov.rec .t::first-letter{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="row">
  <input id="song" placeholder="Song-Name" title="Name für die Stem-Spuren, z. B. BASS_IMSOLOST 132">
  <span class="meta" id="meta"></span>
  <button class="ico" id="upd" title="Nach Updates suchen">⟳</button>
  <button class="ico" id="float" title="Als schwebendes Fenster öffnen">⧉</button>
</div>
<div class="row steps">
  <button id="auto" title="Erkennt die Spuren und färbt sie in der Farbe ihres Stems. Danach in Ableton prüfen und ggf. umfärben. Alt+Klick = rückgängig"><span class="n">1</span>Färben</button>
  <button class="go" id="render" title="Nimmt pro Farbe einen Stem unten im Projekt auf (läuft in Echtzeit)"><span class="n">2</span>Stems rendern</button>
  <button id="pkg" title="Optional: grau gefärbte Passagen + Serum-MIDI als Song-Paket speichern"><span class="n">3</span>Paket</button>
</div>
<div class="grid" id="grid"></div>
<div class="status"><i id="bar"></i><span id="status">Farbe = Stem. Feld klicken = Farbe ändern.</span></div>
<div id="ov"><div class="t" id="ovT"></div><div class="p" id="ovP">0 %</div><div class="b"><i id="ovB"></i></div><div class="s" id="ovS"></div></div>
<div id="pal"><div class="box"><div class="t" id="palT"></div><div class="g" id="palG"></div></div></div>
<script>
const PALETTE = [16749734, 16753961, 13408551, 16249980, 12581632, 1769263, 2490280, 6094824, 9160191, 5538020, 9611263, 14183652, 15029152, 16777215, 16725558, 16149507, 10056267, 16773172, 8912743, 4047616, 49071, 1698303, 1090798, 32192, 8940772, 11958214, 16726484, 13684944, 14837594, 16753524, 13872497, 15597486, 13821080, 12243060, 10208397, 13958625, 13496824, 12173795, 13482980, 11442405, 15064289, 11119017, 13013643, 12026454, 10060650, 12565097, 10927616, 8237133, 8962746, 10204100, 8758722, 8623052, 10851765, 12558270, 12349846, 8092539, 11481907, 11096369, 7491393, 14402304, 8754719, 5480241, 695438, 2319236, 1716118, 3101346, 6441901, 10701741, 13381230, 3947580];
const MAIN = [['bass','Bass'],['kick','Kick'],['top','Tops'],['vox','Vox'],['melo','Melody'],['serum','Serum'],['riser','Riser'],['rest','Rest'],['cut','Schnitt']];
const EXTRA = [['inst1','Inst 10'],['inst2','Inst 11'],['vocal','Vocal Chain'],['free1','Spur 14']];
const SHORT = {bass:'BASS',kick:'KICK',top:'TOPS',vox:'VOCALS',melo:'MELODY',inst1:'INST10',inst2:'INST11',vocal:'VOCALCHAIN',riser:'RISER',free1:'SPUR14'};
const TIP = {rest:'Rest: wird nicht gerendert', cut:'Schnitt: Clips in dieser Farbe (oder grau) werden im Paket als einzelne Clips gespeichert'};
const $ = s => document.querySelector(s);
const toMax = (...a) => window.max ? window.max.outlet(...a) : console.log('max', a);
const hex = rgb => '#' + (rgb >>> 0).toString(16).padStart(6, '0');
let state = null, showExtra = false;

function chip(id, label){
  const c = id==='cut' ? state.cfg.cut : id==='rest' ? state.cfg.rest : state.cfg.colors[id];
  const cnt = (id==='cut'||id==='rest') ? '' : (state.counts[id] || 0);
  const d = document.createElement('div');
  d.className = 'chip' + (cnt ? ' has' : '') + (state.stems.includes(SHORT[id]) ? ' stem' : '');
  d.title = TIP[id] || ((state.names[id]||[]).join(', ') || 'Keine Spur in dieser Farbe') + '\nKlick = Farbe ändern · Shift+Klick = Farbe der ausgewählten Spur';
  d.innerHTML = `<span class="sw" style="background:${c?hex(c.rgb):'transparent'};${c?'':'border:1px dashed #666'}"></span><span class="lbl">${label}</span><span class="cnt">${cnt||''}</span>`;
  d.onclick = e => e.shiftKey ? toMax('learn', id) : openPal(id, label);
  return d;
}
function render(){
  const g = $('#grid'); g.innerHTML = '';
  const extraUsed = EXTRA.some(([id]) => state.counts[id]);
  const list = (showExtra || extraUsed) ? MAIN.slice(0,7).concat(EXTRA, MAIN.slice(7)) : MAIN;
  list.forEach(([id,l]) => g.appendChild(chip(id,l)));
  if(!showExtra && !extraUsed){
    const m = document.createElement('div'); m.className = 'chip more'; m.textContent = '+4 Spalten';
    m.title = 'Inst 10, Inst 11, Vocal Chain, Spur 14'; m.onclick = () => { showExtra = true; render(); }; g.appendChild(m);
  }
  $('#meta').textContent = `${Math.round(state.tempo)} BPM · v${state.version||'?'}`;
  if(!$('#song').value && state.setName) $('#song').value = state.setName.replace(/\.als$/i,'').replace(/[_ ]\d{6}.*$/,'').replace(/[_ ]v\d+$/i,'');
  $('#render').disabled = state.recording;
}
let palLane = null;
function openPal(id, label){
  palLane = id; $('#palT').textContent = `Farbe für ${label}`;
  $('#palG').innerHTML = PALETTE.map((c,i)=>`<i data-i="${i}" style="background:${hex(c)}"></i>`).join('');
  $('#pal').classList.add('on');
}
$('#palG').onclick = e => { const i = e.target.dataset.i; if(i!==undefined) toMax('setcolor', palLane, Number(i)); $('#pal').classList.remove('on'); };
$('#pal').onclick = e => { if(e.target.id==='pal') $('#pal').classList.remove('on'); };
document.addEventListener('keydown', e => { if(e.key==='Escape') $('#pal').classList.remove('on'); });
const songName = () => encodeURIComponent($('#song').value.trim() || 'SONG');
$('#auto').onclick = e => toMax(e.altKey ? 'autoundo' : 'auto');
$('#render').onclick = () => toMax('render', songName());
$('#pkg').onclick = () => toMax('pkg', songName());
$('#upd').onclick = () => toMax('update');
$('#float').onclick = () => toMax('popout');

if(window.max){
  window.max.bindInlet('state', enc => { state = JSON.parse(decodeURIComponent(enc)); render(); });
  window.max.bindInlet('status', enc => { $('#status').textContent = JSON.parse(decodeURIComponent(enc)).text; });
  window.max.bindInlet('progress', enc => { const p = JSON.parse(decodeURIComponent(enc)).pct; $('#bar').style.width = p + '%'; $('#ovB').style.width = p + '%'; $('#ovP').textContent = p + ' %'; });
  window.max.bindInlet('overlay', enc => { const o = JSON.parse(decodeURIComponent(enc));
    $('#ov').classList.toggle('on', !!o.on); $('#ov').classList.toggle('rec', /AUFGENOMMEN/.test(o.title));
    if(o.on){ $('#ovT').textContent = o.title; $('#ovS').textContent = o.sub; $('#ovB').style.width = '0%'; $('#ovP').textContent = '0 %'; } });
  // Kein Abfrage-Timer: das Device schickt neuen Stand selbst, sobald sich in Live etwas ändert.
  toMax('hello');
}
</script>
</body>
</html>
