<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Set Maker – Song-Prep</title>
<style>
:root{--bg:#1b1b1b;--panel:#262626;--line:#3a3a3a;--text:#e6e6e6;--muted:#8d8d8d;--accent:#ff7a2f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:11px/1.3 -apple-system,"Helvetica Neue",sans-serif;padding:6px 8px;display:flex;flex-direction:column;gap:6px;user-select:none}
.top{display:flex;gap:6px;align-items:center}
.title{font-weight:700;letter-spacing:.04em;font-size:11px;color:var(--accent)}
input{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:2px 5px;width:120px}
button{font:inherit;font-weight:600;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:3px 9px;cursor:pointer}
button:hover{border-color:#666}
button.go{background:var(--accent);border-color:var(--accent);color:#111}
.meta{color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px 5px;cursor:pointer;min-width:0}
.chip:hover{border-color:#777}
.sw{flex:none;width:14px;height:14px;border-radius:2px;border:1px dashed #666}
.sw.set{border:none}
.lbl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.has .cnt{color:var(--text)}
.chip.stem{box-shadow:inset 0 -2px 0 var(--accent)}
.status{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bar{height:3px;background:var(--panel);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.foot{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="top">
  <span class="title">SET MAKER</span>
  <input id="song" placeholder="Song-Name">
  <button id="auto" title="Erkennt Spuren über Namen/Clips/Samples und färbt sie ein. Alt+Klick = rückgängig">✦ Auto</button>
  <button class="go" id="render" title="Nimmt pro Farbe einen Full-Stem unten im Projekt auf (Echtzeit)">● Rendern</button>
  <button id="pkg" title="Schreibt Full-Stems, graue Schnitte und Serum-MIDI als Song-Paket">Paket</button>
  <span class="meta" id="meta"></span>
  <button id="upd" title="Prüft auf GitHub, ob es eine neue Version gibt">⟳</button>
  <button id="float" title="Öffnet die Oberfläche als schwebendes Fenster über Ableton">⧉ Schweben</button>
</div>
<div class="grid" id="grid"></div>
<div class="bar"><i id="bar"></i></div>
<div class="foot"><span class="status" id="status">„Auto“ färbt die Spuren vor. Prüfen, dann „Rendern“. Farbe lernen: Spur anklicken, dann Feld. Alt+Klick = vergessen.</span></div>

<script>
const LANES = [
  ['bass','Bass'],['kick','Kick'],['top','Tops'],['vox','Vox'],['melo','Melody'],['serum','Serum'],
  ['inst1','Inst 10'],['inst2','Inst 11'],['vocal','Vocal Chain'],['riser','Riser'],['free1','Spur 14'],['rest','Rest'],['cut','Schnitt']
];
const SHORT = {bass:'BASS',kick:'KICK',top:'TOPS',vox:'VOCALS',melo:'MELODY',inst1:'INST10',inst2:'INST11',vocal:'VOCALCHAIN',riser:'RISER',free1:'SPUR14'};
const $ = s => document.querySelector(s);
const toMax = (...a) => window.max ? window.max.outlet(...a) : console.log('max', a);
const hex = rgb => '#' + (rgb >>> 0).toString(16).padStart(6, '0');
let state = null;

function render(){
  const g = $('#grid'); g.innerHTML = '';
  for(const [id, label] of LANES){
    const c = id==='cut' ? state.cfg.cut : id==='rest' ? state.cfg.rest : state.cfg.colors[id];
    const cnt = (id==='cut'||id==='rest') ? '' : (state.counts[id] || 0);
    const d = document.createElement('div');
    d.className = 'chip' + (cnt ? ' has' : '') + (state.stems.includes(SHORT[id]) ? ' stem' : '');
    d.title = id==='cut' ? 'Clip-Farbe für Passagen (Standard: grau). Clip anklicken, dann hier klicken.'
      : (state.names[id]||[]).join(', ') || 'Spur mit dieser Farbe anklicken, dann hier klicken';
    d.innerHTML = `<span class="sw ${c?'set':''}" style="${c?`background:${hex(c.rgb)}`:(id==='cut'?'background:#8a8a8a;border:none':'')}"></span>
      <span class="lbl">${label}</span><span class="cnt">${cnt===''?'':cnt}</span>`;
    d.onclick = e => toMax(e.altKey ? 'forget' : 'learn', id);
    g.appendChild(d);
  }
  $('#meta').textContent = `${Math.round(state.tempo)} BPM · v${state.version||'?'}`;
  if(!$('#song').value && state.setName) $('#song').value = state.setName.replace(/\.als$/i,'').replace(/[_ ]\d{6}.*$/,'').replace(/[_ ]v\d+$/i,'');
  $('#render').disabled = state.recording;
}
const songName = () => encodeURIComponent($('#song').value.trim() || 'SONG');
$('#auto').onclick = e => toMax(e.altKey ? 'autoundo' : 'auto');
$('#render').onclick = () => toMax('render', songName());
$('#pkg').onclick = () => toMax('pkg', songName());
$('#upd').onclick = () => toMax('update');
$('#float').onclick = () => toMax('popout');

if(window.max){
  window.max.bindInlet('state', enc => { state = JSON.parse(decodeURIComponent(enc)); render(); });
  window.max.bindInlet('status', enc => { $('#status').textContent = JSON.parse(decodeURIComponent(enc)).text; });
  window.max.bindInlet('progress', enc => { $('#bar').style.width = JSON.parse(decodeURIComponent(enc)).pct + '%'; });
  toMax('refresh');
  setInterval(() => toMax('refresh'), 3000); // Farben/Spuren aktuell halten
}
</script>
</body>
</html>
