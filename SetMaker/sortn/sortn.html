<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>sortn</title>
<style>
:root{--bg:#1b1b1b;--panel:#262626;--panel2:#2e2e2e;--line:#3a3a3a;--text:#e6e6e6;--muted:#8d8d8d;--accent:#ff7a2f;--warn:#e8c547}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:11px/1.3 -apple-system,"Helvetica Neue",sans-serif;padding:5px 8px;display:flex;flex-direction:column;gap:4px;user-select:none}
.top{display:flex;gap:5px;align-items:center;flex:none}
.title{font-weight:700;letter-spacing:.04em;color:var(--accent);margin-right:2px}
button{font:inherit;font-weight:600;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:2px 8px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#666}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--accent);border-color:var(--accent);color:#111}
.tabs{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tabs button{border:none;border-radius:0;background:transparent;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text)}
main{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding-top:3px}
main::-webkit-scrollbar{width:6px}main::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
.sw{flex:none;width:12px;height:12px;border-radius:2px;display:inline-block;vertical-align:middle}
/* Vorschau */
.row{display:grid;grid-template-columns:12px minmax(0,1fr) 10px 12px minmax(0,1fr) 108px 8px;gap:5px;align-items:center;padding:1px 2px;border-radius:2px}
.row:hover{background:var(--panel)}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .old{color:var(--muted)}
.row .new.chg{font-weight:600}
.row .arr{color:#555}
.row.dim{opacity:.45}
.dot{width:6px;height:6px;border-radius:50%}
.dot.sicher{background:#5fbf5f}.dot.unsicher{background:var(--warn)}.dot.manual{background:var(--accent)}
select,input[type=text]{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:1px 3px;min-width:0;width:100%}
select{padding:0 1px}
/* Einstellungen */
.opts{display:flex;flex-wrap:wrap;gap:3px 10px;padding:2px 2px 5px;border-bottom:1px solid var(--line);margin-bottom:4px}
.opts label{display:flex;align-items:center;gap:3px;color:var(--muted);white-space:nowrap}
.opts label:hover{color:var(--text)}
.opts input[type=text]{width:80px}
input[type=checkbox]{margin:0;accent-color:var(--accent)}
.cat{display:grid;grid-template-columns:14px 78px minmax(0,1fr) 22px 22px 18px 34px 14px;gap:4px;align-items:center;padding:1px 2px}
.cat .swb{width:14px;height:14px;border-radius:2px;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.cat .ic{color:var(--muted);cursor:pointer;text-align:center}
.cat .ic:hover{color:var(--text)}
.cat label{display:flex;justify-content:center}
.head{color:var(--muted);font-size:10px}
.head > *{white-space:nowrap;overflow:hidden}
.foot2{display:flex;gap:5px;padding:5px 2px}
.status{flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pal{position:fixed;display:none;grid-template-columns:repeat(14,14px);gap:2px;padding:4px;background:#111;border:1px solid #555;border-radius:4px;z-index:9}
#pal i{width:14px;height:14px;border-radius:2px;cursor:pointer}
#pal i:hover{outline:1px solid #fff}
.empty{color:var(--muted);padding:8px 2px}
.bar{flex:none;height:2px;background:var(--panel);border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#gear{display:none}
@media (max-width:520px){
  body{padding:4px 5px;gap:3px}
  .top{gap:3px}
  button{padding:2px 6px}
  .tabs{display:none}
  #gear{display:inline-block;margin-left:auto}
  .row{grid-template-columns:10px minmax(0,1fr) minmax(0,.8fr) 72px 6px;gap:4px}
  .row .arr,.row .sw.oldsw{display:none}
  .row .old{order:3;font-size:10px}
  .row .sw.newsw{order:1}.row .new{order:2}.row select{order:4}.row .dot{order:5}
  .sw{width:10px;height:10px}
}
.keep{display:inline-flex;align-items:center;gap:3px;cursor:pointer;color:var(--muted);margin-left:auto}
.keep i{width:12px;height:12px;border-radius:2px;border:1px solid #666;display:inline-block}
.keep i.off{background:repeating-linear-gradient(45deg,#333 0 3px,#222 3px 6px)}
.keep:hover i{border-color:#bbb}
.clipsT{display:flex;align-items:center;gap:3px;color:var(--muted);white-space:nowrap;cursor:pointer}
.clipsT:hover{color:var(--text)}
#greys{position:fixed;display:none;gap:3px;padding:4px;background:#111;border:1px solid #555;border-radius:4px;z-index:9;align-items:center}
#greys i{width:16px;height:16px;border-radius:2px;cursor:pointer;border:1px solid #444}
#greys i:hover,#greys i.on{outline:1px solid var(--accent)}
#greys span{color:var(--muted);cursor:pointer;padding:0 3px}#greys span:hover{color:var(--text)}
@media (max-width:520px){ #gear{margin-left:0} .tabs+.keep{margin-left:auto} }
@media (min-width:521px){ .tabs{margin-left:6px} }
.wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#busy{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(27,27,27,.92);z-index:5;text-align:center;padding:0 12px}
#busy.on{display:flex}
#busy b{font-size:13px;color:var(--text)}
#busy small{color:var(--muted)}
.bbar{width:80%;max-width:360px;height:8px;background:var(--panel);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
</style>
</head>
<body>
<div class="top">
  <span class="title">sortn</span>
  <button id="analyze" title="Spuren neu einlesen und Vorschau zeigen">↻</button>
  <button class="go" id="run" title="Spuren umbenennen und färben wie in der Vorschau">▶ Ausführen</button>
  <button id="undo" title="Letztes Ausführen rückgängig machen">↶</button>
  <div class="tabs"><button id="tPrev" class="on">Spuren</button><button id="tSet">Einstellungen</button></div>
  <span class="keep" id="keep" title="Spuren in dieser Farbe lässt sortn komplett in Ruhe (Name und Farbe). Klicken = Farbe wählen."><i id="keepSw"></i>Bleibt</span>
  <label class="clipsT" title="Beim Ausführen bekommen die Clips denselben Namen und dieselbe Farbe wie ihre Spur"><input type="checkbox" id="matchClips">Clips</label>
  <button id="gear" title="Einstellungen (Farben, Begriffe …) im großen Fenster">⚙</button>
  <button id="upd" title="Prüft auf GitHub, ob es eine neue Version gibt">⟳</button>
  <button id="float" title="Als schwebendes Fenster öffnen (mehr Platz für Einstellungen)">⧉</button>
</div>
<div class="wrap"><main id="main"></main><div id="busy"><b id="busyT">sortn arbeitet …</b><div class="bbar"><i id="bbar"></i></div><small>Bitte kurz warten, nichts anfassen.</small></div></div>
<div class="bar"><i id="bar"></i></div>
<div class="status" id="status"></div>
<div id="pal"></div>
<div id="greys"></div>

<script>
const $ = s => document.querySelector(s);
const toMax = (...a) => window.max ? window.max.outlet(...a) : console.log('max', a);
const hex = rgb => '#' + ((rgb >>> 0) & 0xffffff).toString(16).padStart(6, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = null, tab = 'prev', dirty = false, timer = null;

const colorOf = idx => S && S.palette[idx] !== undefined ? hex(S.palette[idx]) : '#555';
const catColor = c => c.color && c.color.rgb ? hex(c.color.rgb) : colorOf(c.color && c.color.index);

function draw(){
  if(!S) return;
  $('#undo').disabled = !S.canUndo;
  const kc = S.settings.sort.keepColor, ks = $('#keepSw');
  ks.className = kc >= 0 ? '' : 'off'; ks.style.background = kc >= 0 ? colorOf(kc) : '';
  $('#matchClips').checked = !!S.settings.sort.matchClips;
  $('#tPrev').classList.toggle('on', tab==='prev');
  $('#tSet').classList.toggle('on', tab==='set');
  if(tab==='prev') drawPreview(); else if(!document.activeElement || !$('#main').contains(document.activeElement)) drawSettings();
}

function drawPreview(){
  const m = $('#main'), rows = (S.plan && S.plan.rows) || [], cats = S.settings.categories;
  if(!rows.length){ m.innerHTML = '<div class="empty">Keine Spuren gefunden.</div>'; return; }
  const opts = '<option value="_auto">Auto</option>' + cats.map(c => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('')
    + `<option value="_rest">${esc(S.settings.rest.label)}</option><option value="_skip">Nicht ändern</option>`;
  m.innerHTML = rows.map(r => {
    const stem = r.source === 'stem', skip = r.source === 'skip', keep = r.source === 'keep';
    const chg = r.newName !== r.name;
    const cur = S.overrides[r.id] !== undefined ? S.overrides[r.id] : '_auto';
    const label = r.cat ? (cats.find(c => c.id === r.cat) || {}).label : (stem ? 'Prep-Stem' : S.settings.rest.label);
    const dot = r.source === 'manual' || skip ? 'manual' : r.conf;
    const tip = keep ? 'Farbe „Nicht ändern“: bleibt, wie sie ist' : (stem ? 'Stem-Spur von SetMaker Prep, wird nicht angefasst' : (r.why.join(' · ') || 'Nichts erkannt')) + (r.cat || stem ? '' : ' → ' + label);
    return `<div class="row ${stem||skip||keep?'dim':''}" title="${esc(tip)}">
      <span class="sw oldsw" style="background:${colorOf(r.color)}"></span>
      <span class="nm old" style="padding-left:${r.depth*8}px">${r.isGroup?'▸ ':''}${esc(r.name)}</span>
      <span class="arr">→</span>
      <span class="sw newsw" style="background:${colorOf(r.newColor)}"></span>
      <span class="nm new ${chg?'chg':''}">${esc(r.newName)}</span>
      ${keep ? '<span class="nm old">bleibt</span>' : stem ? '<span class="nm old">Prep-Stem</span>' : `<select data-id="${r.id}">${opts.replace(`value="${esc(cur)}"`, `value="${esc(cur)}" selected`)}</select>`}
      <span class="dot ${dot}" title="${dot==='sicher'?'Sicher erkannt':dot==='unsicher'?'Unsicher, bitte prüfen':dot==='manual'?'Von Hand':''}"></span>
    </div>`;
  }).join('');
  m.querySelectorAll('select').forEach(sel => sel.onchange = () => toMax('override', Number(sel.dataset.id), sel.value));
}

function drawSettings(){
  const s = S.settings, o = s.sort, m = $('#main');
  const lanes = '<option value="">– keine –</option>' + S.lanes.map(l => `<option value="${l.id}">${esc(l.label)}</option>`).join('');
  const cb = (path, label, tip) => `<label title="${esc(tip||'')}"><input type="checkbox" data-o="${path}" ${get(path)?'checked':''}>${label}</label>`;
  const allCase = s.categories.length && s.categories.every(c => c.caseSensitive);
  m.innerHTML = `<div class="opts">
      ${cb('sort.rename','Umbenennen')}${cb('sort.colorize','Färben')}
      <label title="Groß-/Kleinschreibung bei allen Begriffen beachten"><input type="checkbox" id="allCase" ${allCase?'checked':''}>Groß/klein beachten</label>
      ${cb('sort.numberSingle','Nummer auch bei einer Spur','Kick 1 statt Kick')}
      ${cb('sort.keepCustomNames','Eigene Namen behalten','Nur Spuren mit Standardnamen (1-Audio …) umbenennen')}
      ${cb('sort.renameRest','Rest umbenennen','Unbekannte Spuren heißen dann z. B. Rest 1')}
      ${cb('sort.groups','Gruppen nach Inhalt','Gruppe bekommt Name/Farbe, wenn alle Spuren darin gleich sind')}
      <label>Muster <input type="text" data-o="sort.pattern" value="${esc(o.pattern)}" title="{name} = Kategorie, {n} = Nummer"></label>
      <span style="color:var(--muted)">Suchen in:</span>
      ${cb('sort.sources.trackName','Spurname')}${cb('sort.sources.clipNames','Clipnamen')}${cb('sort.sources.fileNames','Sample-Dateien')}${cb('sort.sources.devices','Instrumente')}
    </div>
    <div class="cat head"><span></span><span>Name</span><span>Begriffe (Komma, ≤3 Zeichen = ganzes Wort)</span><span title="Groß/klein beachten">Aa</span><span title="Allgemein: nur wenn nichts Genaueres passt">allg.</span><span></span><span></span><span></span></div>
    ${s.categories.map((c, i) => `<div class="cat" data-i="${i}">
      <span class="swb" data-pal="${i}" style="background:${catColor(c)}" title="Farbe wählen"></span>
      <input type="text" data-f="label" value="${esc(c.label)}">
      <input type="text" data-f="keywords" value="${esc(c.keywords.join(', '))}">
      <label><input type="checkbox" data-f="caseSensitive" ${c.caseSensitive?'checked':''}></label>
      <label><input type="checkbox" data-f="fallback" ${c.fallback?'checked':''}></label>
      <span class="ic" data-learn="${esc(c.id)}" title="Farbe der in Ableton ausgewählten Spur übernehmen">◉</span>
      <span class="ic"><span data-mv="-1" title="Höhere Priorität">▲</span><span data-mv="1" title="Niedrigere Priorität">▼</span></span>
      <span class="ic" data-del title="Kategorie löschen">✕</span>
    </div>`).join('')}
    <div class="cat"><span class="swb" data-pal="rest" style="background:${catColor(s.rest)}" title="Farbe für alles Unbekannte"></span>
      <input type="text" id="restLabel" value="${esc(s.rest.label)}"><span style="color:var(--muted)">alles, was nicht erkannt wird</span><span></span><span></span>
      <span class="ic" data-learn="_rest" title="Farbe der ausgewählten Spur übernehmen">◉</span><span></span><span></span></div>
    <div class="foot2"><button id="add">+ Kategorie</button><button id="reset" title="Alle Einstellungen auf Standard">Standard</button>
      <span style="color:var(--muted);align-self:center">Reihenfolge = Priorität. Gespeichert in sortn_settings.json, nur für sortn.</span></div>`;

  m.querySelectorAll('[data-o]').forEach(el => el.oninput = () => { set(el.dataset.o, el.type==='checkbox' ? el.checked : el.value); push(); });
  $('#allCase').onchange = e => { s.categories.forEach(c => c.caseSensitive = e.target.checked); push(true); };
  $('#restLabel').oninput = e => { s.rest.label = e.target.value; push(); };
  m.querySelectorAll('.cat[data-i]').forEach(row => {
    const c = s.categories[+row.dataset.i];
    row.querySelectorAll('[data-f]').forEach(el => el.oninput = () => {
      const f = el.dataset.f;
      if(el.type==='checkbox') c[f] = el.checked;
      else if(f==='keywords') c.keywords = el.value.split(',').map(x => x.trim()).filter(Boolean);
      else c[f] = el.value;
      push(el.type==='checkbox' || el.tagName==='SELECT');
    });
    row.querySelectorAll('[data-mv]').forEach(el => el.onclick = () => {
      const i = +row.dataset.i, j = i + Number(el.dataset.mv);
      if(j < 0 || j >= s.categories.length) return;
      [s.categories[i], s.categories[j]] = [s.categories[j], s.categories[i]]; push(true);
    });
    row.querySelector('[data-del]').onclick = () => { if(confirm(`Kategorie „${c.label}“ löschen?`)){ s.categories.splice(+row.dataset.i, 1); push(true); } };
  });
  m.querySelectorAll('[data-learn]').forEach(el => el.onclick = () => { flush(); toMax('learncolor', el.dataset.learn); });
  m.querySelectorAll('[data-pal]').forEach(el => el.onclick = e => openPal(el.dataset.pal, e));
  $('#add').onclick = () => { s.categories.push({ id: 'cat' + Date.now().toString(36), label: 'Neu', lane: '', keywords: [], caseSensitive: false, color: { index: 0, rgb: S.palette[0] } }); push(true); };
  $('#reset').onclick = () => { if(confirm('Alle Kategorien und Optionen auf Standard zurücksetzen?')) toMax('resetsettings'); };
}

function get(path){ return path.split('.').reduce((o, k) => o && o[k], S.settings); }
function set(path, v){ const k = path.split('.'), last = k.pop(); k.reduce((o, x) => o[x], S.settings)[last] = v; }
// Änderungen kurz sammeln, dann an das Device schicken (speichert + rechnet neu)
function push(redraw){ dirty = true; clearTimeout(timer); timer = setTimeout(flush, 500); if(redraw){ document.activeElement && document.activeElement.blur(); drawSettings(); } }
function flush(){ clearTimeout(timer); if(!dirty) return; dirty = false; toMax('setsettings', encodeURIComponent(JSON.stringify(S.settings))); }

function openPal(target, e){
  const p = $('#pal');
  p.innerHTML = S.palette.map((rgb, i) => `<i data-i="${i}" style="background:${hex(rgb)}"></i>`).join('');
  p.style.display = 'grid';
  const w = 14*16+8, h = 5*16+8;
  p.style.left = Math.max(2, Math.min(e.clientX, innerWidth - w - 4)) + 'px';
  p.style.top = Math.max(2, Math.min(e.clientY, innerHeight - h - 4)) + 'px';
  p.onclick = ev => {
    const i = ev.target.dataset.i; if(i === undefined) return;
    const c = { index: +i, rgb: S.palette[+i] };
    if(target === 'rest') S.settings.rest.color = c; else S.settings.categories[+target].color = c;
    p.style.display = 'none'; push(true);
  };
}
document.addEventListener('mousedown', e => { if(!$('#pal').contains(e.target) && !e.target.dataset.pal) $('#pal').style.display = 'none'; });

$('#analyze').onclick = () => { flush(); setBusy(true, 'Lese Spuren', 0); toMax('analyze'); };
$('#run').onclick = () => { flush(); setBusy(true, 'Starte', 0); toMax('run'); };
$('#undo').onclick = () => toMax('undo');
const GREYS = [13, 27, 41, 55, 69];
function setSort(k, v){ if(!S) return; S.settings.sort[k] = v; dirty = true; flush(); draw(); }
$('#matchClips').onchange = e => setSort('matchClips', e.target.checked);
$('#keep').onclick = e => {
  if(!S) return;
  const g = $('#greys'), kc = S.settings.sort.keepColor;
  g.innerHTML = GREYS.map(i => `<i data-i="${i}" class="${i===kc?'on':''}" style="background:${colorOf(i)}"></i>`).join('') + '<span data-i="-1" title="Keine Farbe ausklammern">aus</span>';
  g.style.display = 'flex';
  const r = $('#keep').getBoundingClientRect();
  g.style.left = Math.max(2, Math.min(r.left, innerWidth - 140)) + 'px'; g.style.top = (r.bottom + 3) + 'px';
  g.onclick = ev => { const i = ev.target.dataset.i; if(i === undefined) return; g.style.display = 'none'; setSort('keepColor', Number(i)); };
  e.stopPropagation();
};
document.addEventListener('mousedown', e => { if(!$('#greys').contains(e.target) && !$('#keep').contains(e.target)) $('#greys').style.display = 'none'; });
$('#float').onclick = () => toMax('popout');
$('#upd').onclick = () => toMax('update');
$('#tPrev').onclick = () => { flush(); tab = 'prev'; draw(); };
$('#tSet').onclick = () => { if(!S) return; tab = 'set'; drawSettings(); draw(); };
$('#gear').onclick = () => { flush(); toMax('popout'); toMax('showsettings'); };

function setBusy(b, text, pct){
  ['#analyze','#run','#undo'].forEach(s => $(s).disabled = !!b || (s==='#undo' && S && !S.canUndo));
  $('#busy').classList.toggle('on', !!b);
  if(text) $('#busyT').textContent = text + ' …';
  if(pct !== undefined) $('#bbar').style.width = pct + '%';
  if(!b){ $('#bar').style.width = '0'; $('#bbar').style.width = '0'; }
}
function onState(enc){
  const next = JSON.parse(decodeURIComponent(enc));
  if(dirty) next.settings = S.settings; // ungespeicherte Eingaben nicht überschreiben
  S = next; $('#status').textContent = S.status || '';
  $('.title').textContent = 'sortn'; $('.title').title = 'v' + (S.version || '?');
  setBusy(S.busy);
  draw();
}
if(window.max){
  window.max.bindInlet('state', onState);
  const parts = {};
  window.max.bindInlet('chunk', (kind, id, i, n, part) => {
    const p = parts[id] = parts[id] || { got: 0, s: [] };
    if(p.s[i] === undefined){ p.s[i] = part; p.got++; }
    if(p.got === n){ delete parts[id]; if(kind === 'state') onState(p.s.join('')); }
  });
  window.max.bindInlet('progress', enc => { const p = JSON.parse(decodeURIComponent(enc)); setBusy(p.pct < 100, p.text, p.pct); $('#bar').style.width = p.pct + '%'; $('#status').textContent = p.text + ' …'; });
  window.max.bindInlet('tab', enc => { if(innerWidth > 520){ tab = JSON.parse(decodeURIComponent(enc)).tab; if(S){ drawSettings(); draw(); } } });
  window.max.bindInlet('status', enc => { $('#status').textContent = JSON.parse(decodeURIComponent(enc)).text; });
  toMax('hello');
} else window.SM_onState = onState; // Test im Browser
</script>
</body>
</html>
