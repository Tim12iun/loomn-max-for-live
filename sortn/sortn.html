<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>sortn</title>
<style>
:root{--bg:#141414;--surf:#1C1B1A;--panel:#232221;--panel2:#2A2928;--line:#32312F;--text:#F0EEE9;--muted:#8F8C86;--accent:#FF5A1F;--accent2:#EC6636}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:11px/1.35 -apple-system,"SF Pro Text","Helvetica Neue",sans-serif;user-select:none;position:relative}
svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
button{font:inherit;font-weight:600;background:var(--panel);color:var(--text);border:1px solid transparent;border-radius:6px;height:24px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
button:hover{background:var(--panel2)}
button:active{background:var(--surf)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.35;cursor:default}
button.icon{width:24px;padding:0}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);background:var(--panel)}
button.go{background:var(--accent);color:#141414;height:28px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
button.go:hover{background:var(--accent2)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:6px 8px 5px}
.hidden{display:none!important}
.page.front{justify-content:space-between;padding:6px 8px 4px}
.page.front .head{height:20px}
.head{display:flex;align-items:center;gap:4px;height:24px;flex:none}
.vtag{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.title{font-weight:800;color:var(--text);font-size:13px;letter-spacing:.01em;position:relative;padding-right:5px}
.title::after{content:"";position:absolute;right:0;top:2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.sp{flex:1}
.muted{color:var(--muted)}
/* Vorderseite */
.sum{flex:none;display:flex;align-items:center;gap:12px}
.stat{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.stat b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch}
.stat span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.link{margin-left:auto;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:2px}
.link:hover{color:var(--text)}
.act{display:flex;gap:6px;flex:none}
.act .go{flex:1}
.act button.icon{width:28px;height:28px}
.opts{display:flex;align-items:center;gap:16px;flex:none;height:22px}
.opt{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;white-space:nowrap}
.opt:hover{color:var(--text)}
.chip{width:16px;height:16px;border-radius:4px;border:1px solid var(--line)}
.chip.off{background:transparent;border-style:dashed;border-color:var(--muted)}
.caret{width:10px;height:10px;opacity:.7}
/* Umschalter mit zwei Punkten: links aus, rechts an (orange) */
.sw2{flex:none;display:inline-flex;align-items:center;gap:3px;width:28px;height:16px;padding:0 3px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.sw2::before,.sw2::after{content:"";width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:1px solid var(--muted)}
.sw2::before{background:var(--muted)}
.sw2.on::before{background:transparent}
.sw2.on::after{background:var(--accent);border-color:var(--accent)}
.status{flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;padding-top:2px;border-top:1px solid var(--line)}
/* Rückseite */
.tabs{display:flex;background:var(--surf);border-radius:6px;overflow:hidden;margin-left:4px;padding:1px}
.tabs button{border:none;border-radius:5px;height:22px;background:transparent;color:var(--muted);font-weight:600;padding:0 8px}
.tabs button.on{background:var(--panel2);color:var(--text)}
main{flex:1;min-height:0;overflow:auto;margin-top:5px}
main::-webkit-scrollbar{width:6px}main::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
.sw{flex:none;width:10px;height:10px;border-radius:2px;display:inline-block}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) minmax(0,.8fr) 74px 6px;gap:5px;align-items:center;padding:1px 2px;border-radius:3px;min-height:20px}
.row:hover{background:var(--panel)}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.old{color:var(--muted);font-size:10px}
.new.chg{font-weight:600}
.row.dim{opacity:.45}
.dot{width:6px;height:6px;border-radius:50%}
.dot.sicher{background:var(--muted)}.dot.unsicher{border:1px solid var(--text)}.dot.manual{background:var(--accent)}
select,input[type=text]{font:inherit;background:var(--panel);color:var(--text);border:1px solid transparent;border-radius:6px;padding:1px 4px;min-width:0;width:100%;height:20px}
select{padding:0 2px}
.cat{border-bottom:1px solid var(--line);padding:4px 2px;display:grid;grid-template-columns:16px 1fr auto;gap:4px 6px;align-items:center}
.cat .kw{grid-column:2 / 4}
.swb{width:16px;height:16px;border-radius:4px;cursor:pointer;border:1px solid var(--line)}
.tools{display:flex;align-items:center;gap:2px}
.tools label{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:10px;margin-right:4px;cursor:pointer}
.ic{color:var(--muted);cursor:pointer;width:16px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.ic:hover{color:var(--text);background:var(--panel)}
.ic svg{width:12px;height:12px}
.olist{display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.olist .big{display:flex;align-items:center;gap:8px;cursor:pointer}
.olist .big span{display:flex;flex-direction:column}
.olist .big small{color:var(--muted);font-size:10px}

.olist label{display:flex;align-items:center;gap:6px;cursor:pointer}
.olist h4{font-size:10px;color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.olist input[type=text]{width:110px}
input[type=checkbox]{margin:0;accent-color:var(--accent)}
/* Checkbox als Umschalter mit zwei Punkten */
input.tg{appearance:none;-webkit-appearance:none;flex:none;width:26px!important;height:14px!important;border-radius:7px;background:var(--panel) radial-gradient(circle at 7px 50%,var(--muted) 3px,transparent 3.5px) no-repeat;border:1px solid var(--line);cursor:pointer;position:relative}
input.tg::after{content:"";position:absolute;right:3px;top:2px;width:6px;height:6px;border-radius:50%;border:1px solid var(--muted)}
input.tg:checked{background:var(--panel) radial-gradient(circle at 7px 50%,transparent 2.5px,var(--muted) 2.6px,var(--muted) 3.4px,transparent 3.6px) no-repeat}
input.tg:checked::after{background:var(--accent);border-color:var(--accent)}
.foot2{display:flex;gap:6px;padding:6px 2px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);padding:8px 2px}
#pal{position:fixed;display:none;grid-template-columns:repeat(14,14px);gap:2px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:6px;z-index:9;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#pal i{width:14px;height:14px;border-radius:2px;cursor:pointer}
#pal i:hover{outline:1px solid var(--text)}
#greys{position:fixed;display:none;gap:4px;padding:5px;background:var(--surf);border:1px solid var(--line);border-radius:6px;z-index:9;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#greys i{width:18px;height:18px;border-radius:4px;cursor:pointer;border:1px solid var(--line)}
#greys i:hover,#greys i.on{outline:2px solid var(--accent)}
#greys span{color:var(--muted);cursor:pointer;padding:0 4px}#greys span:hover{color:var(--text)}
#busy{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:rgba(20,20,20,.95);z-index:8;text-align:center;padding:0 14px}
#busy.on{display:flex}
#busy b{font-size:13px}
#busy small{color:var(--muted)}
.bbar{width:85%;height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
</style>
</head>
<body>
<svg style="display:none"><defs>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-pick" viewBox="0 0 24 24"><path d="m14 7 3 3"/><path d="M16.5 4.5a2.1 2.1 0 0 1 3 3L9 18l-4 1 1-4z"/></symbol>
</defs></svg>

<!-- Vorderseite -->
<section class="page front" id="front">
  <div class="head">
    <span class="title" id="title">sortn</span>
    <span class="sp"></span>
    <button class="icon ghost" id="analyze" title="Spuren neu einlesen"><svg><use href="#i-refresh"/></svg></button>
    <button class="icon ghost" id="gear" title="Spuren, Kategorien und Optionen"><svg><use href="#i-gear"/></svg></button>
  </div>
  <div class="sum">
    <div class="stat ok"><b id="nKnown">–</b><span>erkannt</span></div>
    <div class="stat warn"><b id="nCheck">–</b><span>prüfen</span></div>
    <div class="stat"><b id="nRest">–</b><span>Rest</span></div>
    <div class="stat"><b id="nChg">–</b><span>Änderungen</span></div>
    <span class="link" id="toTracks">Spuren <svg><use href="#i-next"/></svg></span>
  </div>
  <div class="act">
    <button class="go" id="run" title="Spuren umbenennen und färben">Ausführen</button>
    <button class="icon" id="undo" title="Rückgängig: letztes Ausführen zurücknehmen"><svg><use href="#i-undo"/></svg></button>
  </div>
  <div class="opts">
    <span class="opt" id="keep" title="Spuren in dieser Farbe lässt sortn komplett in Ruhe (Name und Farbe)">Bleibt <span class="chip" id="keepSw"></span><svg class="caret"><use href="#i-down"/></svg></span>
    <span class="opt" id="clipsT" title="Beim Ausführen bekommen die Clips denselben Namen und dieselbe Farbe wie ihre Spur"><span class="sw2" id="clipsSw"></span>Clips angleichen</span>
  </div>
  <div class="status"></div>
</section>

<!-- Rückseite -->
<section class="page hidden" id="back">
  <div class="head">
    <button class="icon ghost" id="backBtn" title="Zurück"><svg><use href="#i-back"/></svg></button>
    <div class="tabs"><button data-t="tracks" class="on">Spuren</button><button data-t="cats">Kategorien</button><button data-t="opts">Optionen</button></div>
    <span class="sp"></span>
    <span class="vtag" id="vtag2"></span>
    <button class="icon ghost" id="upd" title="Auf GitHub nach Update suchen"><svg><use href="#i-dl"/></svg></button>
  </div>
  <main id="main"></main>
  <div class="status"></div>
</section>

<div id="busy"><b id="busyT">sortn arbeitet …</b><div class="bbar"><i id="bbar"></i></div><small>Bitte kurz warten, nichts anfassen.</small></div>
<div id="pal"></div>
<div id="greys"></div>

<script>
const $ = s => document.querySelector(s);
const toMax = (...a) => window.max ? window.max.outlet(...a) : console.log('max', a);
const hex = rgb => '#' + ((rgb >>> 0) & 0xffffff).toString(16).padStart(6, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = (id, cls='') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
let S = null, page = 'front', tab = 'tracks', dirty = false, timer = null;
const colorOf = idx => S && S.palette[idx] !== undefined ? hex(S.palette[idx]) : '#555';
const catColor = c => c.color && c.color.rgb ? hex(c.color.rgb) : colorOf(c.color && c.color.index);
const passive = r => r.source === 'stem' || r.source === 'skip' || r.source === 'keep';

function draw(){
  if(!S) return;
  $('#front').classList.toggle('hidden', page !== 'front');
  $('#back').classList.toggle('hidden', page !== 'back');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if(page === 'front') drawFront();
  else if(tab === 'tracks') drawTracks();
  else if(!document.activeElement || !$('#main').contains(document.activeElement)) (tab === 'cats' ? drawCats : drawOpts)();
}

function drawFront(){
  const rows = (S.plan && S.plan.rows) || [];
  let known = 0, check = 0, rest = 0, chg = 0;
  for(const r of rows){ if(passive(r)) continue; if(r.cat){ known++; if(r.conf === 'unsicher') check++; } else rest++; if(r.newName !== r.name || r.newColor !== r.color) chg++; }
  $('#nKnown').textContent = known; $('#nCheck').textContent = check; $('#nRest').textContent = rest; $('#nChg').textContent = chg;
  $('#undo').disabled = !S.canUndo;
  const kc = S.settings.sort.keepColor, ks = $('#keepSw');
  ks.className = 'chip' + (kc >= 0 ? '' : ' off'); ks.style.background = kc >= 0 ? colorOf(kc) : '';
  $('#clipsSw').classList.toggle('on', !!S.settings.sort.matchClips);
}

function drawTracks(){
  const m = $('#main'), rows = (S.plan && S.plan.rows) || [], cats = S.settings.categories;
  if(!rows.length){ m.innerHTML = '<div class="empty">Keine Spuren gefunden.</div>'; return; }
  const opts = '<option value="_auto">Auto</option>' + cats.map(c => `<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('')
    + `<option value="_rest">${esc(S.settings.rest.label)}</option><option value="_skip">Nicht ändern</option>`;
  m.innerHTML = rows.map(r => {
    const stem = r.source === 'stem', keep = r.source === 'keep', skip = r.source === 'skip';
    const cur = S.overrides[r.id] !== undefined ? S.overrides[r.id] : '_auto';
    const dot = r.source === 'manual' || skip ? 'manual' : r.conf;
    const tip = keep ? 'Farbe „Bleibt“: wird nicht angefasst' : stem ? 'Stem-Spur von prepn, wird nicht angefasst' : (r.why.join(' · ') || 'Nichts erkannt');
    return `<div class="row ${passive(r)?'dim':''}" title="${esc(tip)}">
      <span class="sw" style="background:${colorOf(r.newColor)}"></span>
      <span class="nm new ${r.newName!==r.name?'chg':''}" style="padding-left:${r.depth*8}px">${r.isGroup?'▸ ':''}${esc(r.newName)}</span>
      <span class="nm old">${esc(r.name)}</span>
      ${keep ? '<span class="old">bleibt</span>' : stem ? '<span class="old">Stem</span>' : `<select data-id="${r.id}">${opts.replace(`value="${esc(cur)}"`, `value="${esc(cur)}" selected`)}</select>`}
      <span class="dot ${dot}"></span>
    </div>`;
  }).join('');
  m.querySelectorAll('select').forEach(sel => sel.onchange = () => toMax('override', Number(sel.dataset.id), sel.value));
}

function drawCats(){
  const s = S.settings, m = $('#main');
  m.innerHTML = s.categories.map((c, i) => `<div class="cat" data-i="${i}">
      <span class="swb" data-pal="${i}" style="background:${catColor(c)}" title="Farbe wählen"></span>
      <input type="text" data-f="label" value="${esc(c.label)}" title="Name der Spur">
      <span class="tools">
        <label title="Groß-/Kleinschreibung beachten"><input type="checkbox" class="tg" data-f="caseSensitive" ${c.caseSensitive?'checked':''}>Aa</label>
        <label title="Allgemein: greift nur, wenn nichts Genaueres passt"><input type="checkbox" class="tg" data-f="fallback" ${c.fallback?'checked':''}>allg.</label>
        <span class="ic" data-learn="${esc(c.id)}" title="Farbe der in Ableton ausgewählten Spur übernehmen">${ico('pick')}</span>
        <span class="ic" data-mv="-1" title="Höhere Priorität">${ico('up')}</span>
        <span class="ic" data-mv="1" title="Niedrigere Priorität">${ico('down')}</span>
        <span class="ic" data-del title="Kategorie löschen">${ico('x')}</span>
      </span>
      <input class="kw" type="text" data-f="keywords" value="${esc(c.keywords.join(', '))}" title="Begriffe, mit Komma getrennt. Bis 3 Zeichen zählen nur als ganzes Wort.">
    </div>`).join('') + `
    <div class="cat"><span class="swb" data-pal="rest" style="background:${catColor(s.rest)}" title="Farbe für alles Unbekannte"></span>
      <input type="text" id="restLabel" value="${esc(s.rest.label)}" title="Name für Unbekanntes">
      <span class="tools"><span class="muted" style="font-size:10px;margin-right:4px">alles Unbekannte</span><span class="ic" data-learn="_rest" title="Farbe der ausgewählten Spur übernehmen">${ico('pick')}</span></span></div>
    <div class="foot2"><button id="add">+ Kategorie</button><span class="muted">Reihenfolge = Priorität</span></div>`;
  m.querySelectorAll('.cat[data-i]').forEach(row => {
    const c = s.categories[+row.dataset.i];
    row.querySelectorAll('[data-f]').forEach(el => el.oninput = () => {
      const f = el.dataset.f;
      if(el.type === 'checkbox') c[f] = el.checked;
      else if(f === 'keywords') c.keywords = el.value.split(',').map(x => x.trim()).filter(Boolean);
      else c[f] = el.value;
      push(el.type === 'checkbox');
    });
    row.querySelectorAll('[data-mv]').forEach(el => el.onclick = () => {
      const i = +row.dataset.i, j = i + Number(el.dataset.mv);
      if(j < 0 || j >= s.categories.length) return;
      [s.categories[i], s.categories[j]] = [s.categories[j], s.categories[i]]; push(true);
    });
    row.querySelector('[data-del]').onclick = () => { if(confirm(`Kategorie „${c.label}“ löschen?`)){ s.categories.splice(+row.dataset.i, 1); push(true); } };
  });
  $('#restLabel').oninput = e => { s.rest.label = e.target.value; push(); };
  m.querySelectorAll('[data-learn]').forEach(el => el.onclick = () => { flush(); toMax('learncolor', el.dataset.learn); });
  m.querySelectorAll('[data-pal]').forEach(el => el.onclick = e => openPal(el.dataset.pal, e));
  $('#add').onclick = () => { s.categories.push({ id: 'cat' + Date.now().toString(36), label: 'Neu', lane: '', keywords: [], caseSensitive: false, color: { index: 0, rgb: S.palette[0] } }); push(true); };
}

function drawOpts(){
  const o = S.settings.sort, m = $('#main');
  m.innerHTML = `<div class="olist">
      <label class="big"><input type="checkbox" class="tg" id="numSingle" ${o.numberSingle?'checked':''}>
        <span><b>Immer nummerieren</b><small>„Kick 1“ statt „Kick“, auch wenn es nur eine Kick gibt.</small></span></label>
      <div class="big"><button id="reset">Auf Standard</button>
        <span><small>Setzt Kategorien, Farben und Begriffe zurück.</small></span></div>
    </div>`;
  $('#numSingle').onchange = e => setSort('numberSingle', e.target.checked);
  $('#reset').onclick = () => { if(confirm('Alle Kategorien, Farben und Begriffe auf Standard zurücksetzen?')) toMax('resetsettings'); };
}

function get(path){ return path.split('.').reduce((o, k) => o && o[k], S.settings); }
function set(path, v){ const k = path.split('.'), last = k.pop(); k.reduce((o, x) => o[x], S.settings)[last] = v; }
// Änderungen kurz sammeln, dann an das Device schicken (speichert + rechnet neu)
function push(redraw){ dirty = true; clearTimeout(timer); timer = setTimeout(flush, 500); if(redraw){ document.activeElement && document.activeElement.blur(); draw(); } }
function flush(){ clearTimeout(timer); if(!dirty) return; dirty = false; toMax('setsettings', encodeURIComponent(JSON.stringify(S.settings))); }
function setSort(k, v){ if(!S) return; S.settings.sort[k] = v; dirty = true; flush(); draw(); }

function popAt(el, anchor, w, h){
  el.style.left = Math.max(2, Math.min(anchor.left, innerWidth - w - 4)) + 'px';
  el.style.top = Math.max(2, Math.min(anchor.bottom + 3, innerHeight - h - 4)) + 'px';
}
function openPal(target, e){
  const p = $('#pal');
  p.innerHTML = S.palette.map((rgb, i) => `<i data-i="${i}" style="background:${hex(rgb)}"></i>`).join('');
  p.style.display = 'grid';
  popAt(p, { left: e.clientX, bottom: e.clientY }, 14*16+8, 5*16+8);
  p.onclick = ev => {
    const i = ev.target.dataset.i; if(i === undefined) return;
    const c = { index: +i, rgb: S.palette[+i] };
    if(target === 'rest') S.settings.rest.color = c; else S.settings.categories[+target].color = c;
    p.style.display = 'none'; push(true);
  };
}
const GREYS = [13, 27, 41, 55, 69];
$('#keep').onclick = e => {
  if(!S) return;
  const g = $('#greys'), kc = S.settings.sort.keepColor;
  g.innerHTML = GREYS.map(i => `<i data-i="${i}" class="${i===kc?'on':''}" style="background:${colorOf(i)}"></i>`).join('') + '<span data-i="-1" title="Keine Farbe ausklammern">aus</span>';
  g.style.display = 'flex';
  popAt(g, $('#keepSw').getBoundingClientRect(), 150, 30);
  g.onclick = ev => { const i = ev.target.dataset.i; if(i === undefined) return; g.style.display = 'none'; setSort('keepColor', Number(i)); };
  e.stopPropagation();
};
document.addEventListener('mousedown', e => {
  if(!$('#pal').contains(e.target) && !e.target.dataset.pal) $('#pal').style.display = 'none';
  if(!$('#greys').contains(e.target) && !$('#keep').contains(e.target)) $('#greys').style.display = 'none';
});

$('#clipsT').onclick = () => setSort('matchClips', !(S && S.settings.sort.matchClips));
$('#analyze').onclick = () => { flush(); setBusy(true, 'Lese Spuren', 0); toMax('analyze'); };
$('#run').onclick = () => { flush(); setBusy(true, 'Starte', 0); toMax('run'); };
$('#undo').onclick = () => toMax('undo');
$('#upd').onclick = () => toMax('update');
$('#gear').onclick = () => { if(!S) return; page = 'back'; tab = 'cats'; draw(); };
$('#toTracks').onclick = () => { if(!S) return; page = 'back'; tab = 'tracks'; draw(); };
$('#backBtn').onclick = () => { flush(); page = 'front'; draw(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { flush(); tab = b.dataset.t; draw(); });

function setStatus(t){ document.querySelectorAll('.status').forEach(e => e.textContent = t); }
function setBusy(b, text, pct){
  ['#analyze','#run'].forEach(s => $(s).disabled = !!b);
  $('#undo').disabled = !!b || !(S && S.canUndo);
  $('#busy').classList.toggle('on', !!b);
  if(text) $('#busyT').textContent = text + ' …';
  if(pct !== undefined) $('#bbar').style.width = pct + '%';
  if(!b) $('#bbar').style.width = '0';
}
function onState(enc){
  const next = JSON.parse(decodeURIComponent(enc));
  if(dirty) next.settings = S.settings; // ungespeicherte Eingaben nicht überschreiben
  S = next; setStatus(S.status || '');
  $('#title').title = 'sortn v' + (S.version || '?');
  $('#vtag2').textContent = 'v' + (S.version || '?');
  draw();
  setBusy(S.busy);
}
if(window.max){
  window.max.bindInlet('state', onState);
  const parts = {};
  window.max.bindInlet('chunk', (kind, id, i, n, part) => {
    const p = parts[id] = parts[id] || { got: 0, s: [] };
    if(p.s[i] === undefined){ p.s[i] = part; p.got++; }
    if(p.got === n){ delete parts[id]; if(kind === 'state') onState(p.s.join('')); }
  });
  window.max.bindInlet('progress', enc => { const p = JSON.parse(decodeURIComponent(enc)); setBusy(p.pct < 100, p.text, p.pct); setStatus(p.text + ' …'); });
  window.max.bindInlet('status', enc => { setStatus(JSON.parse(decodeURIComponent(enc)).text); });
  window.max.bindInlet('tab', () => {});
  toMax('hello');
} else window.SM_onState = onState; // Test im Browser
</script>
</body>
</html>
