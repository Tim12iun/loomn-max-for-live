<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>buildn</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;src:url(fonts/BarlowCondensed-Medium.ttf)}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(fonts/BarlowCondensed-SemiBold.ttf)}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/BarlowCondensed-Bold.ttf)}
:root{--bg:#141414;--surface:#1C1B1A;--hi:#232221;--hi2:#2A2928;--line:#32312F;--text:#F0EEE9;--muted:#8F8C86;--accent:#FF5A1F;--accent2:#EC6636;--red:#B5483F;--cw:116px;--rh:24px;--lab:300px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:500 15px/1.3 "Barlow Condensed",-apple-system,sans-serif;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:600;background:var(--hi);color:var(--text);border:none;border-radius:7px;height:32px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{background:var(--hi2)}
button:active{background:#1f1e1d}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.icon{width:32px;padding:0;background:transparent;color:var(--muted)}
button.icon:hover{background:var(--hi);color:var(--text)}
button.main{background:var(--accent);color:#111;text-transform:uppercase;letter-spacing:.06em;min-width:150px}
button.main:hover{background:#ff6c36}
.hidden{display:none!important}
.sec{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;align-items:center;gap:8px;padding:0 12px 10px;flex:none}
.tpl{display:flex;align-items:center;gap:8px;min-width:0;max-width:420px;height:32px;padding:0 12px;border-radius:7px;background:var(--hi);cursor:pointer}
.tpl:hover{background:var(--hi2)}
.tpl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tpl.missing{box-shadow:inset 0 0 0 1px var(--accent)}
.tpl .k{color:var(--muted);font-weight:500}
.tpl .x{width:20px;height:20px;margin-right:-6px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--muted)}
.tpl .x:hover{background:var(--line);color:var(--text)}
.tpl .x svg{width:12px;height:12px}
.old{display:flex;align-items:center;height:100%;padding:0 6px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);border-left:3px solid}
.block.ex .stop .lab{cursor:default;color:var(--muted)}
.block.ex .cell{background:#1f1e1d}
.sp{flex:1}
.wrap{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px 0}
aside{width:250px;flex:none;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;min-height:0}
aside .top{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
aside .list{flex:1;overflow:auto;padding:0 8px 8px}
aside.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.song{margin-bottom:4px}
.song .sh{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;border-radius:8px;background:var(--hi);cursor:grab;position:relative}
.song .sh:hover{background:var(--hi2)}
.song.used .sh::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.song .sh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:16px}
.song .sh .tri{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-radius:4px}
.song .sh .tri:hover{color:var(--text)}
.song .sh .tri svg{width:12px;height:12px;transition:none}
.song .sh .bpm{color:var(--muted);font-size:13px}
.stem{padding:6px 2px 0 26px}
.stem .sn{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between}
.chip{display:flex;align-items:center;gap:5px;height:22px;padding:0 6px 0 3px;border-radius:5px;margin-bottom:3px;cursor:grab;color:#141414;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;filter:saturate(.72) brightness(.92)}
.chip .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.pl{flex:none;width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);cursor:pointer}
.pl:hover{background:rgba(0,0,0,.4)}
.pl svg{width:10px;height:10px;fill:currentColor;stroke:none}
.pl.on{background:#141414;color:var(--accent)}
.rm{flex:none;width:16px;height:16px;border-radius:3px;display:none;align-items:center;justify-content:center;cursor:pointer}
.rm svg{width:10px;height:10px;stroke-width:2}
.cell:hover .rm{display:flex}
.rm:hover{background:rgba(0,0,0,.3)}
aside .foot{padding:10px 12px;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;cursor:pointer}
aside .foot:hover{color:var(--text)}
main{flex:1;min-width:0;overflow:auto;position:relative;background:var(--surface);border-radius:12px}
main::-webkit-scrollbar,aside .list::-webkit-scrollbar{width:8px;height:8px}
main::-webkit-scrollbar-thumb,aside .list::-webkit-scrollbar-thumb{background:var(--hi2);border-radius:4px}
main::-webkit-scrollbar-corner{background:transparent}
.grid{display:inline-block;min-width:100%;padding:0 0 24px}
.row{display:flex;height:var(--rh)}
.row>div{width:var(--cw);flex:none;border-right:1px solid var(--bg);border-bottom:1px solid var(--bg);position:relative;overflow:hidden}
.row .lab{width:var(--lab);padding:0 8px 0 12px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;background:var(--surface);position:sticky;left:0;z-index:2}
.hrow{position:sticky;top:0;z-index:3;height:30px}
.hrow>div{display:flex;align-items:center;padding:0 8px;font-weight:700;font-size:14px;color:#141414;letter-spacing:.02em;filter:saturate(.72) brightness(.92)}
.hrow .lab{background:var(--surface);filter:none;color:var(--muted)}
.stop{height:22px}
.stop>div:not(.lab){background:#4a4845}
.stop>div:not(.lab)::after{content:"";position:absolute;left:8px;right:8px;top:10px;border-top:2px dotted #8f8c86}
.stop .lab{cursor:grab;color:var(--text);font-weight:700;font-size:15px}
.stop .lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.stop .lab .x{width:22px;height:22px;flex:none}
.cell{background:#242322}
.cell.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .chip{height:100%;margin:0;border-radius:0}
.cell.auto .chip{cursor:default;opacity:.8}
.ab{display:inline-flex;gap:3px;flex:none}
.ab button{height:20px;width:46px;padding:0;font-size:12px;border-radius:5px;color:var(--muted);background:var(--hi)}
.ab button:hover{color:var(--text)}
.block.dragging{opacity:.35}
.block.dropbefore{box-shadow:0 -3px 0 var(--accent)}
.endrow{height:56px;display:flex;align-items:center;justify-content:center;margin:10px 12px 0 calc(var(--lab) + 12px);border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);position:sticky;left:0;max-width:600px}
.endrow.drop{border-color:var(--accent);color:var(--text)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);text-align:center;padding:24px;font-size:17px;border:1.5px dashed transparent;border-radius:12px}
.empty.drop{border-color:var(--accent);color:var(--text)}
.status{flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;padding:0 16px;height:30px;display:flex;align-items:center;gap:10px}
.status .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.status a{color:var(--text);cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex:none}
.status.err .t{color:#d9776d}
#back{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
#back .body{padding:8px 24px;display:flex;flex-direction:column;gap:24px;max-width:680px;overflow:auto}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px}
.tog{flex:none;width:44px;height:24px;border-radius:12px;background:var(--hi);display:flex;align-items:center;justify-content:space-between;padding:0 4px;cursor:pointer}
.tog i{width:16px;height:16px;border-radius:8px;border:1.5px solid var(--muted)}
.tog.on i:last-child,.tog:not(.on) i:first-child{background:var(--muted);border-color:var(--muted)}
.tog.on i:last-child{background:var(--accent);border-color:var(--accent)}
.path{color:var(--muted);font-size:14px;word-break:break-all;margin:4px 0 8px;-webkit-user-select:text;user-select:text}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ver{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#busy{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,20,20,.94);z-index:30}
#busy.on{display:flex}
#busy b{font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.bbar{width:320px;height:6px;background:var(--hi);border-radius:3px;overflow:hidden}
.bbar i{display:block;height:100%;width:0;background:var(--accent)}
#busyS{color:var(--muted);height:20px}
</style>
</head>
<body>
<svg style="display:none"><defs>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>

</defs></svg>

<header>
  <div class="tpl" id="tpl"><svg><use href="#i-file"/></svg><span class="k" id="tplKind"></span><b id="tplName">Vorlage wählen</b><span class="x hidden" id="baseClose" title="Set schließen, wieder ein neues Set aus der Vorlage bauen"><svg><use href="#i-x"/></svg></span></div>
  <button id="openSet" title="Ein bestehendes Live-Set öffnen und weitere Songs anhängen"><svg><use href="#i-file"/></svg>Set öffnen</button>

  <button id="addSongs" title="Song-Ordner von prepn laden"><svg><use href="#i-folder"/></svg>Songs laden</button>

</header>
<div class="wrap">
  <aside id="aside">
    <div class="top"><span class="sec">Songs</span><span class="sec num" id="songCount"></span></div>

</div>
<div class="status" id="status"><span class="t" id="statusT"></span><span id="statusA"></span></div>

<section id="back" class="hidden">
  <header style="padding-top:2px">
    <button class="icon" id="backBtn" title="Zurück"><svg><use href="#i-back"/></svg></button>
    <span class="sec" style="color:var(--text)">Einstellungen</span>
  </header>
  <div class="body">
    <div>
      <div class="sec">Set erstellen</div>
      <div class="opt"><span>Szenen nach dem Song benennen</span><span class="tog" id="optNames" title="An/Aus"><i></i><i></i></span></div>
      <div class="opt"><span>Song-Tempo in die Szenen schreiben (Szene starten wechselt das Tempo)</span><span class="tog" id="optTempo" title="An/Aus"><i></i><i></i></span></div>
    </div>
    <div>
      <div class="sec">Vorlage für neue Sets</div>
      <div class="path" id="tplInfo"></div>
      <div class="btns"><button id="tplPick">Andere Vorlage wählen …</button></div>
    </div>
    <div>
      <div class="sec">Datenordner</div>
      <div class="path" id="dataPath"></div>
      <div class="btns"><button id="dReveal">Im Finder zeigen</button><button id="dRelink">Anderen Ordner verknüpfen …</button><button id="dMove">Ordner verschieben …</button></div>
    </div>
    <div>
      <div class="sec">Songs</div>
      <div class="path">Geladene Ordner werden beim Start neu eingelesen.</div>
      <div class="btns"><button id="clearSongs">Song-Liste leeren</button></div>
    </div>
    <div class="ver num"><span id="ver"></span><button class="icon" id="upd" title="Nach Updates suchen"><svg><use href="#i-dl"/></svg></button></div>
  </div>
</section>
<div id="busy"><b id="busyT">Set wird gebaut</b><div class="bbar"><i id="bbar"></i></div><span id="busyS"></span></div>

<script>
"use strict";
const PALETTE = [16749734,16753961,13408551,16249980,12581632,1769263,2490280,6094824,9160191,5538020,9611263,14183652,15029152,16777215,16725558,16149507,10056267,16773172,8912743,4047616,49071,1698303,1090798,32192,8940772,11958214,16726484,13684944,14837594,16753524,13872497,15597486,13821080,12243060,10208397,13958625,13496824,12173795,13482980,11442405,15064289,11119017,13013643,12026454,10060650,12565097,10927616,8237133,8962746,10204100,8758722,8623052,10851765,12558270,12349846,8092539,11481907,11096369,7491393,14402304,8754719,5480241,695438,2319236,1716118,3101346,6441901,10701741,13381230,3947580];
// Stem-Spalten oben im Live-Set (wie SELF_LIVESET_V3). Mit Vorlage kommen Namen und Farben aus dem .als.
const DEFAULT_COLS = [["A BASS",28],["B BASS",28],["A/B KICK",14],["A TOPS",65],["B TOPS",65],["A/B VOX",12],["A MELODY",1],["B MELODY",1]];
const ROWS = 3; // pro Song: Zeile 1 + 2 = deine Clips, Zeile 3 = Full-Stems (automatisch)
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex = i => '#' + (PALETTE[i] ?? 0x888888).toString(16).padStart(6, '0');

// ---------- Verbindung zur App ----------
const inApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge);
function native(cmd, args){
  if (!inApp) return Promise.reject(new Error('Nur in der App'));
  return window.webkit.messageHandlers.bridge.postMessage(Object.assign({ cmd }, args || {}));
}
function b64ToBytes(b){ const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function bytesToB64(u){ let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }

// ---------- Zustand ----------
let songs = [];        // {key(=Ordnerpfad), name, tempo, dir, folder, stems:[{stem, kind, full:{name,file,path}, clips:[{name,file,path}]}]}
let lineup = [];       // {key, side:{bass:'A'|'B'...}, cells:[{colName: ref}, {colName: ref}]}   ref = "<key>|<stem>|<clip|F>"
let roots = [];        // geladene Ordner (Pfade)
let cols = DEFAULT_COLS.map(([name, color]) => colInfo(name, color));
let tpl = null;        // {name, file (Kopie im Datenordner/Vorlage), src (Original)}
let base = null;       // geöffnetes Set {name, path, blocks:[{name, rows:[{spalte: clipname}]}]}
let opts = { tempo: false, names: true };
let open = {};
let info = { version: '', build: '' };
let undo = [], redo = [];

function colInfo(name, color){
  const n = name.toUpperCase();
  const m = n.match(/^(A\/B|A|B)\s+(.*)$/);
  return { name, color, side: m ? (m[1] === 'A/B' ? 'AB' : m[1]) : 'AB', kind: kindOf(m ? m[2] : n) };
}
function kindOf(s){
  s = String(s || '').toUpperCase();
  if (/KICK/.test(s)) return 'kick';
  if (/BASS|\bSUB\b|808/.test(s)) return 'bass';
  if (/TOP|HAT|PERC|DRUM|SNARE|CLAP/.test(s)) return 'top';
  if (/VOX|VOC/.test(s)) return 'vox';
  if (/MELO|SYNTH|LEAD|PLUCK|PAD|CHORD/.test(s)) return 'melo';
  if (/RISER|FX/.test(s)) return 'riser';
  return null;
}
const LANE_KIND = { bass:'bass', kick:'kick', top:'top', vox:'vox', melo:'melo', riser:'riser' };
const song = key => songs.find(s => s.key === key);
function parseRef(ref){ const j = ref.lastIndexOf('|'), i = ref.lastIndexOf('|', j - 1); return [ref.slice(0, i), ref.slice(i + 1, j), ref.slice(j + 1)]; }
function clipOf(ref){
  if (!ref) return null;
  const [k, si, ci] = parseRef(ref), s = song(k);
  const st = s && s.stems[+si]; if (!st) return null;
  const clip = ci === 'F' ? st.full : st.clips[+ci];
  return clip ? { song: s, stem: st, clip, full: ci === 'F' } : null;
}
function sideOf(b, kind, i){ return (b.side && b.side[kind]) || ((i + (base ? base.blocks.length : 0)) % 2 ? 'B' : 'A'); }
function tplPath(){ return !tpl ? null : tpl.file ? info.data + '/Vorlage/' + tpl.file : tpl.path; }
function colFor(kind, side){
  const c = cols.filter(c => c.kind === kind);
  return c.find(x => x.side === side) || c.find(x => x.side === 'AB') || c[0] || null;
}
// Zeile 3: Full-Stems landen automatisch in der Spalte ihres Stems (A/B je Song)
function autoRow(b, i){
  const s = song(b.key), out = {};
  if (!s) return out;
  s.stems.forEach((st, si) => {
    if (!st.full) return;
    const c = colFor(st.kind, sideOf(b, st.kind, i));
    if (c && !out[c.name]) out[c.name] = s.key + '|' + si + '|F';
  });
  return out;
}

// ---------- Status ----------
function status(t, actions, err){
  $('#statusT').textContent = t; $('#statusT').title = t;
  $('#status').classList.toggle('err', !!err);
  $('#statusA').innerHTML = (actions || []).map((a, i) => `<a data-act="${i}">${esc(a[0])}</a>`).join(' ');
  $('#statusA').onclick = e => { const a = e.target.closest('[data-act]'); if (a) actions[+a.dataset.act][1](); };
}
function busy(on, title, sub){ $('#busy').classList.toggle('on', !!on); if (title) $('#busyT').textContent = title; $('#busyS').textContent = sub || ''; if (!on) pct(0); }
let lastPct = -1;
function pct(p){ p = Math.round(p); if (p === lastPct) return; lastPct = p; $('#bbar').style.width = p + '%'; }
function hint(){
  if (!songs.length) return 'Oben „Songs laden“: einen Paket-Ordner von prepn wählen oder einen Ordner, in dem viele liegen.';
  if (!lineup.length) return 'Song von links in die Mitte ziehen.';
  if (!tpl && !base) return 'Oben links die Vorlage wählen (dein Live-Set) oder ein bestehendes Set öffnen.';
  return 'Clips aus einem Song (aufklappen) in Zeile 1 und 2 ziehen · Song am Namen verschieben · dann „Set erstellen“.';
}

// ---------- Speichern im Datenordner ----------
let saveTimer = null;
function save(){
  if (!inApp) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => native('saveState', { json: JSON.stringify({ roots, tpl, base: base && { name: base.name, path: base.path }, cols, opts, lineup }) }).catch(() => {}), 150);
}
function change(fn){ undo.push(JSON.stringify(lineup)); if (undo.length > 100) undo.shift(); redo = []; fn(); save(); draw(); }

// ---------- Songs laden ----------
function readSong(p){
  let j; try { j = JSON.parse(p.json); } catch (e) { return null; }
  const files = new Set(p.files), dir = p.dir, folder = dir.split('/').pop();
  const strip = n => n.replace(/\.(wav|aiff?|aif)$/i, '');
  const find = base => p.files.find(n => strip(n) === base);
  const s = { key: dir, dir, folder, name: String(j.song || folder.replace(/-Live-Set( \d+)?$/, '')).toUpperCase(), tempo: Number(j.tempo) || 120, stems: [] };
  (j.lanes || []).filter(l => l.stem).forEach((l, i) => {
    const f = (j.files || [])[i] || {};
    const fullName = f.stem && files.has(f.stem) ? f.stem : find(l.stem);
    const clips = (l.clips || []).map((c, ci) => {
      const fn = (f.clips || [])[ci] && files.has(f.clips[ci]) ? f.clips[ci] : find(c.name);
      return fn ? { name: c.name, file: fn, path: dir + '/' + fn } : null;
    }).filter(Boolean);
    s.stems.push({ stem: l.stem, lane: l.lane, kind: LANE_KIND[l.lane] || kindOf(l.stem) || kindOf(l.lane),
                   full: fullName ? { name: l.stem, file: fullName, path: dir + '/' + fullName } : null, clips });
  });
  return s;
}
async function rescan(){
  const found = await native('scan', { paths: roots });
  songs = found.map(readSong).filter(Boolean);
  songs.sort((a, b) => a.name.localeCompare(b.name) || a.folder.localeCompare(b.folder));
}
async function addSongs(){
  const picked = await native('pickFolders');
  if (!picked.length) return;
  const before = songs.length;
  for (const p of picked) if (!roots.includes(p)) roots.push(p);
  await rescan(); save(); draw();
  const n = songs.length - before;
  status(n > 0 ? n + (n > 1 ? ' Songs' : ' Song') + ' geladen. ' + hint() : 'Kein neues Song-Paket gefunden (gesucht wird nach SETMAKER.json von prepn).');
}

// ---------- Vorlage ----------
async function gunzipMaybe(u){
  if (u[0] !== 0x1f || u[1] !== 0x8b) return new TextDecoder().decode(u);
  const ds = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
async function loadTemplateDoc(path){ return parseXml(await gunzipMaybe(b64ToBytes(await native('readB64', { path })))); }
async function chooseTemplate(){
  const path = await native('pickTemplate'); if (!path) return;
  try {
    busy(true, 'Vorlage wird gelesen');
    const L = readLiveSet(await loadTemplateDoc(path));
    busy(false);
    if (!L.upper.length) throw new Error('Keine Stem-Spalten gefunden (Spuren wie „A BASS“, „A/B KICK“).');
    let file = null; try { file = await native('storeTemplate', { path }); } catch (e) {}
    tpl = file ? { name: file, file, src: path } : { name: path.split('/').pop(), path };
    if (!base) cols = L.upper.map(t => colInfo(t.name, t.color));
    save(); draw();
    status('Vorlage ' + tpl.name + ' ist hinterlegt (' + L.upper.length + ' Stem-Spalten). Neue Sets starten oben leer, die Songs der Vorlage lässt buildn weg. ' + (L.stopper ? '' : 'Achtung: kein ==== Trenner-Clip in der Vorlage gefunden.'));
  } catch (e) { busy(false); status('Vorlage geht nicht: ' + (e.message || e), null, true); }
}

// ---------- Bestehendes Set öffnen ----------
const isStop = c => !!c && /^[=\-_ ]{3,}$/.test(val(c, 'Name') || '');
// Songs oben im Set lesen: Blöcke zwischen den ==== Trennern, nur die Clip-Namen (zum Anschauen)
function readExisting(L){
  const lastUpper = upperEnd(L), blocks = [];
  let cur = null;
  for (let r = 0; r <= lastUpper; r++){
    const stop = L.upper.some(t => isStop(slotClip(t.slots[r])));
    if (stop){ cur = { scene: (L.scenes[r] && val(L.scenes[r], 'Name')) || '', rows: [] }; blocks.push(cur); continue; }
    const row = {};
    for (const t of L.upper){ const c = slotClip(t.slots[r]); if (c) row[t.name] = val(c, 'Name') || '(ohne Namen)'; }
    if (!cur){ cur = { scene: '', rows: [] }; blocks.push(cur); }
    cur.rows.push(row);
  }
  const out = blocks.filter(b => b.rows.some(r => Object.keys(r).length));
  out.forEach(b => { b.name = b.scene || guessName(b.rows); });
  return out;
}
function guessName(rows){
  const n = {};
  rows.forEach(r => Object.values(r).forEach(v => {
    const m = v.replace(/^\s*\d+\s+/, '').match(/_(.+?)(\s+\d+)?\s*$/); if (m) n[m[1].trim()] = (n[m[1].trim()] || 0) + 1;
  }));
  const best = Object.entries(n).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0].toUpperCase() : 'Song';
}
// letzte Zeile, in der oben (Stem-Spalten) noch etwas liegt
function upperEnd(L){ let last = -1; L.upper.forEach(t => t.slots.forEach((s, r) => { if (slotClip(s) && r > last) last = r; })); return last; }
async function loadBase(path){
  const L = readLiveSet(await loadTemplateDoc(path));
  if (!L.upper.length) throw new Error('Keine Stem-Spalten gefunden (Spuren wie „A BASS“, „A/B KICK“).');
  base = { name: path.split('/').pop(), path, blocks: readExisting(L) };
  cols = L.upper.map(t => colInfo(t.name, t.color));
}
async function openSet(){
  const path = await native('pickTemplate', { open: true }); if (!path) return;
  try {
    busy(true, 'Set wird gelesen');
    await loadBase(path);
    busy(false); save(); draw();
    status(base.name + ': ' + base.blocks.length + (base.blocks.length === 1 ? ' Song' : ' Songs') + ' im Set. Neue Songs hängt buildn darunter an.');
  } catch (e) { busy(false); base = null; draw(); status('Set geht nicht auf: ' + (e.message || e), null, true); }
}
async function closeBase(){
  base = null;
  if (tpl){ try { cols = readLiveSet(await loadTemplateDoc(tplPath())).upper.map(t => colInfo(t.name, t.color)); } catch (e) {} }
  save(); draw(); status('Neues Set aus der Vorlage. ' + hint());
}

// ---------- .als lesen / schreiben ----------
function parseXml(txt){
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.querySelector('parsererror') || !doc.documentElement || doc.documentElement.nodeName !== 'Ableton') throw new Error('Keine gültige .als-Datei');
  return doc;
}
const kids = (el, name) => el ? [...el.children].filter(c => !name || c.nodeName === name) : [];
const kid = (el, name) => kids(el, name)[0] || null;
const path = (el, ...names) => names.reduce((e, n) => kid(e, n), el);
const val = (el, ...names) => { const e = path(el, ...names); return e ? e.getAttribute('Value') : null; };
function setVal(el, names, v){ const e = path(el, ...names); if (e) e.setAttribute('Value', String(v)); return e; }
function readLiveSet(doc){
  const set = kid(doc.documentElement, 'LiveSet');
  const tracks = kids(kid(set, 'Tracks')).filter(t => /^(Audio|Midi|Group)Track$/.test(t.nodeName)).map(t => ({
    el: t, type: t.nodeName, name: (val(t, 'Name', 'UserName') || val(t, 'Name', 'EffectiveName') || '').trim(),
    color: Number(val(t, 'Color')) || 0,
    slots: kids(path(t, 'DeviceChain', 'MainSequencer', 'ClipSlotList'), 'ClipSlot')
  }));
  const upper = tracks.filter(t => t.type === 'AudioTrack' && /^(A\/B|A|B)\s+\S/i.test(t.name));
  const scenes = kids(kid(set, 'Scenes'), 'Scene');
  let stopper = null;
  for (const t of upper) for (const s of t.slots){
    const c = slotClip(s);
    if (c && /^[=\-_ ]{3,}$/.test(val(c, 'Name') || '')){ stopper = c; break; }
    if (stopper) break;
  }
  return { doc, set, tracks, upper, scenes, stopper };
}
function slotClip(slot){ const v = path(slot, 'ClipSlot', 'Value'); return v ? v.firstElementChild : null; }
function slotValue(slot){ return path(slot, 'ClipSlot', 'Value'); }

// Mehr Szenen anlegen: jede Clip-Slot-Liste mit genau N Einträgen (Spuren, Freeze, Main) wächst mit
function growScenes(L, need){
  const n = L.scenes.length; if (need <= n) return;
  const lists = [...L.doc.getElementsByTagName('ClipSlotList')].filter(l => kids(l, 'ClipSlot').length === n);
  const scenesEl = kid(L.set, 'Scenes'), lastScene = L.scenes[n - 1];
  const maxId = els => els.reduce((m, e) => Math.max(m, Number(e.getAttribute('Id')) || 0), -1);
  let sid = maxId(L.scenes);
  for (let i = n; i < need; i++){
    const sc = lastScene.cloneNode(true); sc.setAttribute('Id', String(++sid));
    setVal(sc, ['Name'], ''); setVal(sc, ['IsTempoEnabled'], 'false'); setVal(sc, ['Color'], '-1');
    scenesEl.appendChild(sc);
    for (const l of lists){
      const slots = kids(l, 'ClipSlot'), cs = slots[slots.length - 1].cloneNode(true);
      cs.setAttribute('Id', String(maxId(slots) + 1));
      const v = path(cs, 'ClipSlot', 'Value'); if (v) while (v.firstChild) v.removeChild(v.firstChild);
      setVal(cs, ['LomId'], '0');
      l.appendChild(cs);
    }
  }
  L.scenes = kids(scenesEl, 'Scene');
  for (const t of L.tracks) t.slots = kids(path(t.el, 'DeviceChain', 'MainSequencer', 'ClipSlotList'), 'ClipSlot');
}
// Weniger Szenen: hinten abschneiden (dort ist nach dem Verschieben alles leer)
function shrinkScenes(L, need){
  const n = L.scenes.length; if (need >= n) return;
  const lists = [...L.doc.getElementsByTagName('ClipSlotList')].filter(l => kids(l, 'ClipSlot').length === n);
  for (const l of lists) kids(l, 'ClipSlot').slice(need).forEach(c => l.removeChild(c));
  L.scenes.slice(need).forEach(sc => sc.parentNode.removeChild(sc));
  L.scenes = kids(kid(L.set, 'Scenes'), 'Scene');
  for (const t of L.tracks) t.slots = kids(path(t.el, 'DeviceChain', 'MainSequencer', 'ClipSlotList'), 'ClipSlot');
}
function putClip(slot, clipEl){
  const v = slotValue(slot); if (!v) return;
  while (v.firstChild) v.removeChild(v.firstChild);
  v.appendChild(clipEl);
}
// Audio-Clip aus einem Grundgerüst (Live 12). Warp-Marker exakt im Song-Tempo.
const CLIP_SKELETON = `<AudioClip Id="0" Time="0"><LomId Value="0" /><LomIdView Value="0" /><CurrentStart Value="0" /><CurrentEnd Value="4" /><Loop><LoopStart Value="0" /><LoopEnd Value="4" /><StartRelative Value="0" /><LoopOn Value="true" /><OutMarker Value="4" /><HiddenLoopStart Value="0" /><HiddenLoopEnd Value="4" /></Loop><Name Value="" /><Annotation Value="" /><Color Value="0" /><LaunchMode Value="0" /><LaunchQuantisation Value="0" /><TimeSignature><TimeSignatures><RemoteableTimeSignature Id="0"><Numerator Value="4" /><Denominator Value="4" /><Time Value="0" /></RemoteableTimeSignature></TimeSignatures></TimeSignature><Envelopes><Envelopes /></Envelopes><ScrollerTimePreserver><LeftTime Value="0" /><RightTime Value="4" /></ScrollerTimePreserver><TimeSelection><AnchorTime Value="0" /><OtherTime Value="0" /></TimeSelection><Legato Value="false" /><Ram Value="false" /><GrooveSettings><GrooveId Value="-1" /></GrooveSettings><Disabled Value="false" /><VelocityAmount Value="0" /><FollowAction><FollowTime Value="4" /><IsLinked Value="true" /><LoopIterations Value="1" /><FollowActionA Value="4" /><FollowActionB Value="0" /><FollowChanceA Value="100" /><FollowChanceB Value="0" /><JumpIndexA Value="1" /><JumpIndexB Value="1" /><FollowActionEnabled Value="false" /></FollowAction><Grid><FixedNumerator Value="1" /><FixedDenominator Value="16" /><GridIntervalPixel Value="20" /><Ntoles Value="2" /><SnapToGrid Value="true" /><Fixed Value="false" /></Grid><FreezeStart Value="0" /><FreezeEnd Value="0" /><IsWarped Value="true" /><TakeId Value="1" /><IsInKey Value="true" /><ScaleInformation><Root Value="0" /><Name Value="0" /></ScaleInformation><AutomationEnvelopesListWrapper LomId="0" /><SampleRef><FileRef><RelativePathType Value="0" /><RelativePath Value="" /><Path Value="" /><Type Value="2" /><LivePackName Value="" /><LivePackId Value="" /><OriginalFileSize Value="0" /><OriginalCrc Value="0" /><SourceHint Value="" /></FileRef><LastModDate Value="0" /><SourceContext /><SampleUsageHint Value="0" /><DefaultDuration Value="0" /><DefaultSampleRate Value="44100" /><SamplesToAutoWarp Value="0" /></SampleRef><Onsets><UserOnsets /><HasUserOnsets Value="false" /></Onsets><WarpMode Value="0" /><GranularityTones Value="30" /><GranularityTexture Value="65" /><FluctuationTexture Value="25" /><TransientResolution Value="6" /><TransientLoopMode Value="2" /><TransientEnvelope Value="100" /><ComplexProFormants Value="100" /><ComplexProEnvelope Value="128" /><Sync Value="true" /><HiQ Value="true" /><Fade Value="true" /><Fades><FadeInLength Value="0" /><FadeOutLength Value="0" /><ClipFadesAreInitialized Value="true" /><CrossfadeInState Value="0" /><FadeInCurveSkew Value="0" /><FadeInCurveSlope Value="0" /><FadeOutCurveSkew Value="0" /><FadeOutCurveSlope Value="0" /><IsDefaultFadeIn Value="true" /><IsDefaultFadeOut Value="true" /></Fades><PitchCoarse Value="0" /><PitchFine Value="0" /><SampleVolume Value="1" /><WarpMarkers><WarpMarker Id="0" SecTime="0" BeatTime="0" /><WarpMarker Id="1" SecTime="1" BeatTime="2" /></WarpMarkers><SavedWarpMarkersForStretched /><MarkersGenerated Value="false" /><IsSongTempoLeader Value="false" /></AudioClip>`;
function makeAudioClip(doc, a){
  const el = new DOMParser().parseFromString(CLIP_SKELETON, 'application/xml').documentElement;
  const clip = doc.importNode(el, true);
  const secs = a.frames / a.rate, beats = Math.max(0.25, Math.round(secs * a.tempo / 60 * 1000) / 1000);
  setVal(clip, ['CurrentEnd'], beats);
  for (const n of ['LoopEnd', 'OutMarker', 'HiddenLoopEnd']) setVal(clip, ['Loop', n], beats);
  setVal(clip, ['ScrollerTimePreserver', 'RightTime'], beats);
  setVal(clip, ['Name'], a.name); setVal(clip, ['Color'], a.color);
  setVal(clip, ['WarpMode'], a.warpMode);
  const fr = path(clip, 'SampleRef', 'FileRef');
  setVal(fr, ['RelativePathType'], a.rel ? 1 : 0); setVal(fr, ['RelativePath'], a.rel || ''); setVal(fr, ['Path'], a.path || '');
  setVal(fr, ['OriginalFileSize'], a.size);
  setVal(clip, ['SampleRef', 'LastModDate'], Math.floor((a.mtime || 0) / 1000));
  setVal(clip, ['SampleRef', 'DefaultDuration'], a.frames); setVal(clip, ['SampleRef', 'DefaultSampleRate'], Math.round(a.rate));
  const wm = kids(path(clip, 'WarpMarkers'), 'WarpMarker');
  wm[1].setAttribute('SecTime', String(secs)); wm[1].setAttribute('BeatTime', String(beats));

}
// Plan: welche Zeile bekommt was. Rückgabe [{row, stop:true, song}, {row, cells:{col:ref}}]
function plan(){
  const out = [];
  lineup.forEach((b, i) => {
    const s = song(b.key); if (!s) return;
    out.push({ stop: true, song: s, block: b });
    out.push({ cells: b.cells[0] || {}, song: s }); out.push({ cells: b.cells[1] || {}, song: s });
    out.push({ cells: autoRow(b, i), song: s, full: true });
  });
  if (out.length) out.push({ stop: true, end: true });
  return out;
}

async function buildSet(){
  if (!base && !tpl) return chooseTemplate();
  if (!lineup.length){ status('Erst Songs ins Line-up ziehen.'); return; }
  const day = new Date().toISOString().slice(0, 10);
  const src = base ? base.path : (tpl.src || tpl.path), dirOf = p => p.substring(0, p.lastIndexOf('/'));
  const outPath = await native('pickSave', { name: base ? base.name.replace(/\.als$/i, '') + ' + buildn.als' : 'LIVESET ' + day + '.als', dir: dirOf(src) });
  if (!outPath) return;
  if (outPath === tplPath()){ status('Die Vorlage wird nie überschrieben. Bitte einen anderen Namen wählen.', null, true); return; }
  busy(true, 'Set wird gebaut', 'Vorlage lesen …'); pct(0);
  try {
    const doc = await loadTemplateDoc(base ? base.path : tplPath());
    const L = readLiveSet(doc);
    const byName = {}; L.upper.forEach(t => byName[t.name.toUpperCase()] = t);
    const last = upperEnd(L), low = lowerRange(L), n = L.scenes.length;
    const gap = low && low.start > last ? low.start - last : 6;          // Abstand wie in der Vorlage
    const tail = n - 1 - Math.max(last, low ? low.end : -1);             // leere Szenen ganz unten
    let row;
    if (base){
      // Bestehendes Set: unter dem letzten belegten Platz weiter. Ist das ein Trenner, geht es dort weiter.
      row = last + 1;
      if (last >= 0 && L.upper.every(t => isStop(t.slots[last] && slotClip(t.slots[last])))) row = last;
    } else {
      // Neues Set: die Songs, die in der Vorlage stehen, fliegen raus. Spuren, Geräte und der rechte Block bleiben.
      const stopEnd = low ? low.start : n;
      for (const t of L.upper) for (let r = 0; r < stopEnd; r++){ const v = slotValue(t.slots[r]); if (v) while (v.firstChild) v.removeChild(v.firstChild); }
      for (let r = 0; r <= last; r++) if (L.scenes[r]){ setVal(L.scenes[r], ['Name'], ''); setVal(L.scenes[r], ['IsTempoEnabled'], 'false'); }
      row = 0;
    }
    const P = plan();
    const endRow = row + P.length - 1;                          // letzter Trenner
    const delta = low ? (base ? Math.max(0, endRow + gap - low.start) : endRow + gap - low.start) : 0;
    const need = Math.max(endRow + 1, low ? low.end + delta + 1 : 0) + Math.max(0, tail);
    if (need > n) growScenes(L, need);
    if (low && delta) shiftLower(L, low.start, low.end, delta);
    if (need < n && !base) shrinkScenes(L, need);
    const missing = new Set(), lost = [], stopClip = L.stopper, outDir = outPath.substring(0, outPath.lastIndexOf('/'));
    let done = 0; const total = P.reduce((n, p) => n + (p.stop ? 0 : Object.keys(p.cells).length), 0) || 1;
    for (let i = 0; i < P.length; i++, row++){
      const p = P[i];
      if (p.stop){
        if (stopClip) for (const t of L.upper){ const s = t.slots[row]; if (s && !slotClip(s)) putClip(s, stopClip.cloneNode(true)); }
        if (L.scenes[row] && p.song && opts.names) setVal(L.scenes[row], ['Name'], p.song.name + ' ' + Math.round(p.song.tempo));
        continue;
      }
      if (opts.tempo && p.song && L.scenes[row]){ setVal(L.scenes[row], ['Tempo'], p.song.tempo); setVal(L.scenes[row], ['IsTempoEnabled'], 'true'); }
      for (const [colName, ref] of Object.entries(p.cells)){
        const t = byName[colName.toUpperCase()], c = clipOf(ref);
        if (!t || !c){ missing.add(colName); continue; }
        let a; try { a = await native('audioInfo', { path: c.clip.path }); } catch (e) { lost.push(c.clip.file); continue; }
        const stemName = c.stem.stem.replace(/\s+\d+$/, '');
        const name = p.full ? Math.round(c.song.tempo) + ' ' + stemName : stemName;
        putClip(t.slots[row], makeAudioClip(doc, { name, color: t.color, tempo: c.song.tempo, frames: a.frames, rate: a.rate,
          size: 0, mtime: 0, path: c.clip.path, rel: relPath(outDir, c.clip.path),
          warpMode: (c.stem.kind === 'kick' || c.stem.kind === 'top') ? 0 : 4 }));
        pct(100 * ++done / total);
        $('#busyS').textContent = c.song.name + ' · ' + name;
      }
    }
    $('#busyS').textContent = 'Datei schreiben …';
    let xml = new XMLSerializer().serializeToString(doc);
    if (!/^<\?xml/.test(xml)) xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + xml;
    const gz = new Uint8Array(await new Response(new Blob([xml]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    await native('writeB64', { path: outPath, data: bytesToB64(gz) });
    busy(false);
    const name = outPath.split('/').pop();
    let msg = 'Fertig: ' + name + (base ? ', ' + lineup.length + (lineup.length > 1 ? ' Songs' : ' Song') + ' angehängt.' : ' mit ' + lineup.length + (lineup.length > 1 ? ' Songs.' : ' Song.'));
    if (!L.stopper) msg += ' Die Vorlage hatte keinen ==== Trenner-Clip, Trenner fehlen.';
    if (missing.size) msg += ' Spalten nicht in der Vorlage: ' + [...missing].join(', ') + '.';
    if (lost.length) msg += ' Fehlende Dateien: ' + lost.length + '.';
    status(msg, [['In Live öffnen', () => native('openFile', { path: outPath })], ['Im Finder zeigen', () => native('reveal', { path: outPath })]], lost.length > 0);
  } catch (e) { busy(false); status('Set erstellen fehlgeschlagen: ' + (e.message || e), null, true); }
}
// Pfad vom Ordner des neuen Sets zur Audiodatei (Live findet die Datei damit auch, wenn sich der Start des Pfads ändert)
function relPath(fromDir, file){
  const a = fromDir.split('/').filter(Boolean), b = file.split('/').filter(Boolean);
  let k = 0; while (k < a.length && k < b.length - 1 && a[k] === b[k]) k++;
  return Array(a.length - k).fill('..').concat(b.slice(k)).join('/');
}
// Rechter Block (alles, was keine Stem-Spalte ist: Serum, Instrumente, Vocal Chain, MIDI …) bleibt unberührt,
// rutscht aber als Ganzes nach unten, damit er nie in einer Zeile mit den Song-Blöcken liegt.
function lowerRange(L){
  const up = new Set(L.upper); let a = Infinity, b = -1;
  L.tracks.filter(t => !up.has(t)).forEach(t => t.slots.forEach((s, r) => { if (slotClip(s)){ a = Math.min(a, r); b = Math.max(b, r); } }));
  return b < 0 ? null : { start: a, end: b };
}
function shiftLower(L, from, to, delta){
  const up = new Set(L.upper);
  const order = []; for (let r = from; r <= to; r++) order.push(r);
  if (delta > 0) order.reverse();                               // nach unten: von hinten, nach oben: von vorne
  for (const t of L.tracks){
    if (up.has(t)) continue;
    for (const r of order){
      const src = slotValue(t.slots[r]), dst = slotValue(t.slots[r + delta]);
      if (!src || !dst) continue;
      while (dst.firstChild) dst.removeChild(dst.firstChild);
      while (src.firstChild) dst.appendChild(src.firstChild);
    }
  }
}

// ---------- Vorhören (macht die App, kann WAV und AIFF) ----------
let playing = null;
async function togglePlay(ref){
  if (playing === ref){ playing = null; draw(); native('stop').catch(() => {}); return; }
  const c = clipOf(ref); if (!c) return;
  try { await native('play', { path: c.clip.path }); playing = ref; }
  catch (e) { playing = null; status('Abspielen geht nicht: ' + (e.message || e), null, true); }
  draw();
}
window.onNative = kind => {
  if (kind === 'ended'){ playing = null; draw(); }
  if (kind === 'data') start();
};

// ---------- Zeichnen ----------
function chip(ref, o){
  const c = clipOf(ref); if (!c) return '';
  const col = colFor(c.stem.kind, 'A'), bg = col ? hex(col.color) : '#9a9a9a';
  const pre = c.stem.stem.replace(/_.*$/, ''), num = (c.clip.name.match(/Clip \d+$/) || ['Full'])[0];
  const label = o.list ? num : pre + ' ' + num;
  const on = playing === ref;
  return `<div class="chip" draggable="${o.auto ? 'false' : 'true'}" data-ref="${esc(ref)}" style="background:${bg}" title="${esc(c.song.name + ' · ' + c.clip.name)}">`
    + `<span class="pl ${on ? 'on' : ''}" data-play="${esc(ref)}" title="${on ? 'Stopp' : 'Vorhören'}"><svg><use href="#i-${on ? 'stop' : 'play'}"/></svg></span><span class="t">${esc(label)}</span>`
    + (o.cell ? `<span class="rm" data-rm="1" title="Clip aus dem Set nehmen"><svg><use href="#i-x"/></svg></span>` : '') + '</div>';
}
function drawSongs(){
  const used = new Set(lineup.map(b => b.key));
  $('#songCount').textContent = songs.length || '';
  $('#songs').innerHTML = songs.length ? songs.map(s => {
    const o = open[s.key];
    const body = o ? s.stems.map((st, si) => {
      const clips = st.clips.map((c, ci) => chip(s.key + '|' + si + '|' + ci, { list: true })).join('');
      return `<div class="stem"><div class="sn"><span>${esc(st.stem.replace(/_.*$/, ''))}</span><span class="num">${st.clips.length ? st.clips.length + ' Clips' : 'nur Full-Stem'}</span></div>${clips}</div>`;
    }).join('') : '';
    return `<div class="song ${used.has(s.key) ? 'used' : ''}"><div class="sh" draggable="true" data-song="${esc(s.key)}" title="${esc(s.dir)}\nIn die Mitte ziehen = Song ins Line-up">`
      + `<span class="tri" data-open="${esc(s.key)}" title="Clips zeigen"><svg><use href="#i-${o ? 'tri-d' : 'tri'}"/></svg></span><b>${esc(s.name)}</b><span class="bpm num">${Math.round(s.tempo)} BPM</span></div>${body}</div>`;
  }).join('') : '<div class="muted" style="padding:8px 4px;color:var(--muted)">Noch keine Songs.</div>';
}
function drawGrid(){
  const lab = t => `<div class="lab">${t || ''}</div>`;
  let h = `<div class="row hrow">${lab('<span class="sec">Line-up</span>')}${cols.map(c => `<div style="background:${hex(c.color)}">${esc(c.name)}</div>`).join('')}</div>`;
  // Songs, die schon im geöffneten Set stehen: nur zum Anschauen
  if (base) base.blocks.forEach(b => {
    h += `<div class="block ex"><div class="row stop"><div class="lab" title="Steht schon im Set ${esc(base.name)}"><span class="nm">${esc(b.name)}</span><span class="sec" style="font-size:11px">im Set</span></div>${cols.map(() => '<div></div>').join('')}</div>`;
    b.rows.forEach((r, ri) => {
      h += `<div class="row">${lab(ri === b.rows.length - 1 && b.rows.length > 2 ? 'Full-Stems' : 'Clips ' + (ri + 1))}`
        + cols.map(c => { const t = r[c.name]; return `<div class="cell">${t ? `<div class="old" style="border-color:${hex(c.color)}" title="${esc(t)}">${esc(t)}</div>` : ''}</div>`; }).join('') + '</div>';
    });
    h += '</div>';
  });
  lineup.forEach((b, i) => {
    const s = song(b.key);
    const kinds = ['bass', 'top', 'melo'].filter(k => cols.filter(c => c.kind === k).length > 1);
    const names = { bass: 'Bass', top: 'Tops', melo: 'Melo' };
    const abBtns = kinds.map(k => `<button data-ab="${i}|${k}" title="Full-Stem ${names[k]} in die andere Spalte (A/B)">${names[k]} ${sideOf(b, k, i)}</button>`).join('');
    h += `<div class="block" data-block="${i}">`;
    h += `<div class="row stop"><div class="lab" draggable="true" data-blk="${i}" title="Ziehen = ganzen Song im Line-up verschieben"><span class="nm">${esc(s ? s.name + ' ' + Math.round(s.tempo) : 'Song fehlt')}</span><span class="ab">${abBtns}</span><button class="icon x" data-del="${i}" title="Song aus dem Line-up nehmen (⌘Z holt ihn zurück)"><svg><use href="#i-x"/></svg></button></div>${cols.map(() => '<div></div>').join('')}</div>`;
    const auto = autoRow(b, i);
    for (let r = 0; r < ROWS; r++){
      const isAuto = r === ROWS - 1;
      h += `<div class="row">${lab(isAuto ? 'Full-Stems' : 'Clips ' + (r + 1))}`;
      h += cols.map(c => {
        const ref = isAuto ? auto[c.name] : (b.cells[r] || {})[c.name];
        return `<div class="cell ${isAuto ? 'auto' : ''}" ${isAuto ? '' : `data-cell="${i}|${r}|${esc(c.name)}"`}>${ref ? chip(ref, { auto: isAuto, cell: !isAuto }) : ''}</div>`;
      }).join('') + '</div>';
    }
    h += '</div>';
  });
  if (lineup.length){
    h += `<div class="row stop">${lab('')}${cols.map(() => '<div></div>').join('')}</div>`;
    h += `<div class="endrow" id="endrow">Weiteren Song hierher ziehen</div>`;
  }
  $('#grid').innerHTML = h;
  $('#empty').classList.toggle('hidden', lineup.length > 0);
  $('#empty').innerHTML = songs.length ? 'Song von links hierher ziehen.<br><span style="font-size:15px">Zeile 3 füllt buildn mit den Full-Stems, Zeile 1 und 2 belegst du mit Clips.</span>'
                                       : 'Noch keine Songs.<br><span style="font-size:15px">Oben „Songs laden“ und einen Paket-Ordner von prepn wählen.</span>';
}
function setTog(el, on){ el.classList.toggle('on', !!on); }
function draw(){
  drawSongs(); drawGrid();
  $('#tplKind').textContent = base ? 'Set' : tpl ? 'Neu aus' : '';
  $('#tplName').textContent = base ? base.name : tpl ? tpl.name : 'Vorlage wählen';
  $('#tpl').title = base ? base.path + '\nKlick = anderes Set öffnen' : 'Vorlage für neue Sets wählen. buildn legt eine Kopie im Datenordner ab, die Songs darin lässt es beim Bauen weg.';
  $('#tpl').classList.toggle('missing', !tpl && !base);
  $('#baseClose').classList.toggle('hidden', !base);
  $('#openSet').classList.toggle('hidden', !!base);
  $('#build').disabled = !lineup.length;
  $('#build').textContent = base ? 'Songs anhängen' : 'Set erstellen';
  $('#tplInfo').textContent = tpl ? tpl.name + (tpl.src ? ' (Kopie von ' + tpl.src + ')' : '') : 'Noch keine Vorlage gewählt.';
  const v = 'Version ' + info.version + ' · Build ' + info.build;
  $('#verLine').textContent = v; $('#ver').textContent = v;
  $('#dataPath').textContent = info.data || '–';
  setTog($('#optTempo'), opts.tempo); setTog($('#optNames'), opts.names);
}

// ---------- Drag & Drop ----------
let drag = null;
document.addEventListener('dragstart', e => {
  const t = e.target.closest ? e.target : e.target.parentElement;
  const bl = t.closest('[data-blk]'), ch = t.closest('.chip[draggable="true"]'), sh = t.closest('[data-song]');
  if (bl) drag = { type: 'block', index: +bl.dataset.blk };
  else if (ch){ const cell = ch.closest('[data-cell]'); drag = { type: 'clip', ref: ch.dataset.ref, from: cell ? cell.dataset.cell : null }; }
  else if (sh) drag = { type: 'song', key: sh.dataset.song };
  else return;
  e.dataTransfer.effectAllowed = 'copyMove';
  e.dataTransfer.setData('text/plain', 'buildn');
  if (drag.type === 'block') document.querySelector(`[data-block="${drag.index}"]`)?.classList.add('dragging');
});
document.addEventListener('dragend', () => { drag = null; clearDrop(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });
function clearDrop(){ document.querySelectorAll('.drop,.dropbefore').forEach(x => x.classList.remove('drop', 'dropbefore')); lastTgt = null; }
function target(e){
  if (!drag) return null;
  if (drag.type === 'clip'){
    const cell = e.target.closest('[data-cell]'); if (cell) return { el: cell, cls: 'drop' };
    if (drag.from && e.target.closest('aside')) return { el: $('#aside'), cls: 'drop', remove: true };
  }
  if (drag.type === 'song' || drag.type === 'block'){
    const blk = e.target.closest('[data-block]'); if (blk) return { el: blk, cls: 'dropbefore', before: +blk.dataset.block };
    if (e.target.closest('#main')) return { el: lineup.length ? $('#endrow') : $('#empty'), cls: 'drop', before: lineup.length };
  }
  return null;
}
let lastTgt = null;
document.addEventListener('dragover', e => {
  const t = target(e);
  if (lastTgt && (!t || lastTgt !== t.el)) clearDrop();
  if (!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect = e.altKey && drag.type === 'clip' ? 'copy' : 'move';
  if (lastTgt !== t.el){ t.el.classList.add(t.cls); lastTgt = t.el; }
});
document.addEventListener('drop', e => {
  const t = target(e); if (!t) return;
  e.preventDefault();
  const d = drag; drag = null; clearDrop();
  change(() => {
    if (d.type === 'clip'){
      const clear = from => { const [b, r, c] = from.split('|'); if (lineup[+b] && lineup[+b].cells[+r]) delete lineup[+b].cells[+r][c]; };
      if (t.remove){ clear(d.from); return; }
      const [b, r, c] = t.el.dataset.cell.split('|'), blk = lineup[+b];
      blk.cells[+r] = blk.cells[+r] || {};
      const prev = blk.cells[+r][c];
      if (d.from && d.from !== t.el.dataset.cell && !e.altKey){
        clear(d.from);
        if (prev){ const [fb, fr, fc] = d.from.split('|'); lineup[+fb].cells[+fr] = lineup[+fb].cells[+fr] || {}; lineup[+fb].cells[+fr][fc] = prev; } // tauschen
      }
      blk.cells[+r][c] = d.ref;
    } else if (d.type === 'song'){
      lineup.splice(t.before, 0, { key: d.key, side: {}, cells: [{}, {}] });
    } else if (d.type === 'block'){
      const [b] = lineup.splice(d.index, 1);
      lineup.splice(t.before > d.index ? t.before - 1 : t.before, 0, b);
    }
  });
});

// ---------- Klicks und Tasten ----------
document.addEventListener('click', e => {
  const pl = e.target.closest('[data-play]'); if (pl){ e.stopPropagation(); togglePlay(pl.dataset.play); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm){ const cell = rm.closest('[data-cell]'); const [b, r, c] = cell.dataset.cell.split('|'); change(() => { delete lineup[+b].cells[+r][c]; }); return; }
  const op = e.target.closest('[data-open]'); if (op){ open[op.dataset.open] = !open[op.dataset.open]; draw(); return; }
  const del = e.target.closest('[data-del]'); if (del){ change(() => lineup.splice(+del.dataset.del, 1)); status('Song aus dem Line-up genommen. ⌘Z holt ihn zurück.'); return; }
  const ab = e.target.closest('[data-ab]');
  if (ab){ const [i, k] = ab.dataset.ab.split('|'); change(() => { const b = lineup[+i]; b.side = b.side || {}; b.side[k] = sideOf(b, k, +i) === 'A' ? 'B' : 'A'; }); return; }
});
document.addEventListener('keydown', e => {
  if (e.metaKey && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    const from = e.shiftKey ? redo : undo, to = e.shiftKey ? undo : redo;
    if (!from.length) return;
    to.push(JSON.stringify(lineup)); lineup = JSON.parse(from.pop()); save(); draw();
  }
  if (e.key === 'Escape'){ $('#back').classList.add('hidden'); }
});
$('#addSongs').onclick = () => addSongs().catch(err => status(String(err.message || err), null, true));
const fail = err => status(String(err.message || err), null, true);
$('#tpl').onclick = e => { if (e.target.closest('#baseClose')) return closeBase().catch(fail); (base ? openSet() : chooseTemplate()).catch(fail); };
$('#openSet').onclick = () => openSet().catch(fail);
$('#tplPick').onclick = () => chooseTemplate().catch(fail);
$('#build').onclick = () => buildSet();
$('#gear').onclick = () => $('#back').classList.remove('hidden');
$('#backBtn').onclick = () => $('#back').classList.add('hidden');
$('#optTempo').onclick = () => { opts.tempo = !opts.tempo; save(); draw(); };
$('#optNames').onclick = () => { opts.names = !opts.names; save(); draw(); };
$('#clearSongs').onclick = async () => {
  if (!(await native('confirm', { text: 'Alle Songs aus der Liste nehmen? Das Line-up wird dabei geleert. Die Ordner selbst bleiben unangetastet.', action: 'Leeren', danger: true }))) return;
  roots = []; songs = []; lineup = []; undo = []; redo = []; save(); draw(); status(hint());
};
$('#dReveal').onclick = () => native('dataReveal');
$('#dRelink').onclick = () => native('dataRelink');
$('#dMove').onclick = () => native('dataMove');
$('#upd').onclick = $('#verLine').onclick = () => native('checkUpdates');

// ---------- Start ----------
async function start(){
  if (!inApp){ status('Diese Seite läuft nur in der buildn-App.', null, true); draw(); return; }
  try {
    info = await native('info');
    const raw = await native('loadState');
    const st = raw ? JSON.parse(raw) : {};
    roots = st.roots || []; tpl = st.tpl || null; opts = Object.assign({ tempo: false, names: true }, st.opts || {});
    lineup = st.lineup || []; if (st.cols && st.cols.length) cols = st.cols;
    if (roots.length) await rescan();
    if (st.base && st.base.path){
      try { await loadBase(st.base.path); }
      catch (e) { base = null; draw(); status('Das zuletzt geöffnete Set ist nicht mehr da: ' + st.base.path, null, true); return; }
    }
    draw();
    const gone = lineup.filter(b => !song(b.key)).length;
    status(gone ? gone + ' Song(s) im Line-up nicht gefunden: Ordner verschoben? Über „Songs laden“ neu wählen.' : hint(), null, gone > 0);
  } catch (e) { draw(); status('Start: ' + (e.message || e), null, true); }
}
start();
</script>
</body>
